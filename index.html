<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Svg Studio Edit Pro</title>
    <style>
       :root {
  --bg: #1e1e1e;
  --panel: #333;
  --accent: #0078d4;
  --text: #eee;
  --border: #444;
  --canvas-bg: #ffffff;
}

/* 基本リセット / レイアウト安定化 */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: #282828;
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  user-select: none;
  -webkit-user-select: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden; /* アプリ風なら良いが、必要に応じて変更 */
}

/* ヘッダ */
header {
  background: var(--bg);
  height: 60px;
  flex: 0 0 60px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  border-bottom: 2px solid var(--border);
  gap: 10px;
  z-index: 1100; /* 明確に上にする */
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* メインエリア（ヘッダ下で残りを取る）*/
#main {
  flex: 1 1 auto;
  display: flex;
  min-height: 0; /* children の flex アイテムの高さ collapse を防ぐ */
  overflow: hidden;
}

/* サイドバー */
#sidebar {
  width: 75px;
  flex: 0 0 75px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 15px;
  gap: 15px;
  z-index: 1000;
  overflow: auto;
}

/* ツールボタン */
.tool-icon {
  width: 55px;
  height: 55px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  font-size: 30px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s ease, transform 0.08s ease;
  -webkit-tap-highlight-color: transparent;
}
.tool-icon:hover { background: #555; }
.tool-icon.active { background: var(--accent); }

/* ビューポート */
#viewport {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 0; /* 重要：親の flex collapse を防ぐ */
  background: #191919;
  touch-action: none;
}

/* ステージ（キャンバスを内包） */
#view-stage {
  position: relative;
  transform-origin: center center;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(0,0,0,0.8);
  background: var(--canvas-bg);
  width: calc(100% - 32px); /* サイドの余白を避けつつ余裕を持たせる */
  height: calc(100% - 32px);
  max-width: 100%;
  max-height: 100%;
  border-radius: 6px;
}

/* キャンバス群 */
#canvas-stack {
  width: 100%;
  height: 100%;
  position: relative;
}

/* レイヤーキャンバス共通 */
canvas.layer-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  display: block;
  pointer-events: none;
  background: transparent !important;
}

/* 描画用（入力を受ける）キャンバス */
#paint-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  pointer-events: auto !important;
  z-index: 1000;
  cursor: crosshair;
  background: transparent;
}
#paint-canvas.hand-mode { cursor: grab; }
#paint-canvas.move-mode { cursor: move; }

/* 選択範囲（マルキーボックス） */
#marquee-box {
  position: absolute;
  border: 2px dashed #fff;
  outline: 1px solid #000;
  display: none;
  z-index: 2000;
  pointer-events: none;
  background: rgba(255,255,255,0.02);
}

/* 変形ハンドル */
.morph-handle {
  position: absolute;
  width: 12px;
  height: 12px;
  background: #ff6600;
  border: 2px solid white;
  border-radius: 50%;
  cursor: grab;
  z-index: 2001;
  display: none; /* JS で display:block にする設計 */
  transform: translate(-50%, -50%);
}
.morph-handle:hover { background: #ffaa00; }
.morph-handle.active { background: #ff0000; display: block; }

/* 3D モーダル */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 5000;
  justify-content: center;
  align-items: center;
}
.modal-content {
  background: var(--panel);
  padding: 20px;
  border-radius: 12px;
  border: 2px solid var(--accent);
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-close { float: right; cursor: pointer; font-size: 24px; color: #aaa; }
.modal-close:hover { color: white; }
.modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--accent); }

/* コントロール行 */
.control-row { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
.control-row label { width: 80px; color: #aaa; }
.control-row input[type="range"] { flex: 1; }
.control-row .value { width: 40px; text-align: right; color: var(--accent); font-weight: bold; }

/* 右パネル（レイヤー等）*/
#right-panel {
  width: 280px;
  flex: 0 0 280px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: auto;
  min-width: 200px;
}

/* 共通コントロール */
.control-group { padding: 12px; border-bottom: 1px solid #444; font-size: 13px; }
.control-group label { display: block; margin-bottom: 8px; color: #aaa; }
#layer-panel-section { flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; }
.layer-header-tools { padding: 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #444; }
#layer-list { flex: 1 1 auto; overflow-y: auto; padding: 6px; display: flex; flex-direction: column-reverse; min-height: 0; }
.layer-item { background: #444; margin: 4px 0; padding: 12px; font-size: 14px; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
.layer-item.active { background: var(--accent); border: 1px solid white; }
.layer-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.layer-btn { background: none; border: none; color: white;*

</head>
<body>

<header>
    <h3>Svg Studio Edit <span style="color:red;">Pro</span></h3>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <button class="action-btn" onclick="undo()">↩️ 戻す</button>
    <button class="action-btn" onclick="redo()">↪️ やり直す</button>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <button class="action-btn" style="background:#0078d4;" onclick="changeCanvasDimensionsManual()">📐 キャンバスサイズ</button>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <button class="action-btn" style="background:#cc3333;" onclick="deleteSelectionContent()">🗑️ 選択削除</button>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <input type="file" id="myFile" accept="image/*" style="display:none;"><button class="action-btn" onclick="document.getElementById('myFile').click()">🖼️ 画像追加</button>
    <button class="action-btn" style="background:#444;" onclick="exportSVG()">📤 SVG保存</button>
    <button class="action-btn" style="background:#444;" onclick="document.getElementById('svg-loader').click()">📥 SVG読込</button>
    <input type="file" id="svg-loader" class="hidden-file" accept=".svg" onchange="importSVG(this)">
    <button class="action-btn" onclick="downloadImage()" style="margin-left:auto; background: #0078d4;">💾 PNG保存</button>
</header>

<div id="main">
    <div id="sidebar">
        <button class="tool-icon active" id="btn-pen" onclick="setTool('pen')" title="ペンツール">🖌️</button>
        <button class="tool-icon" id="btn-eraser" onclick="setTool('eraser')" title="消しゴムツール">🧽</button>
        <button class="tool-icon" id="btn-bucket" onclick="setTool('bucket')" title="バケツ塗りつぶし">🪣</button>
        <button class="tool-icon" id="btn-marquee" onclick="setTool('marquee')" title="選択枠ツール">🔲</button>
        <button class="tool-icon" id="btn-hand" onclick="setTool('hand')" title="手のひらツール">✋</button>
        <button class="tool-icon" id="btn-morph" onclick="setTool('morph')" title="形を変えるツール">🔄</button>
        <button class="tool-icon" id="btn-3d" onclick="openModal3D()" title="3D機能">🎮</button>
        <div class="divider"></div>
        <button class="tool-icon" style="background:#444; font-size:22px;" onclick="copySelectionContent()" title="選択をコピー">✂️</button>
        <button class="tool-icon" style="background:#444; font-size:22px;" onclick="pasteToSameLayer()" title="貼り付け">📋</button>
        <div class="divider"></div>
        <input type="color" id="colorPicker" value="#000000" style="width:50px; height:40px; cursor:pointer; border-radius:8px;">
    </div>

    <div id="viewport">
        <div id="view-stage">
            <div id="canvas-stack">
                <canvas id="paint-canvas"></canvas>
            </div>
            <div id="marquee-box"></div>
            <div id="morph-handles-container"></div>
        </div>
    </div>

    <div id="right-panel">
        <div class="control-group">
            <label id="size-label">ブラシの太さ</label>
            <input type="range" id="sizeSlider" min="1" max="100" value="10" oninput="onSizeSliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="sizeValue">10</span>px</div>
        </div>
        <div class="control-group">
            <label>レイヤー透明度</label>
            <input type="range" id="opacitySlider" min="0" max="100" value="100" oninput="onOpacitySliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="opacityValue">100</span>%</div>
        </div>
        <div class="control-group">
            <label>選択範囲の大きさ (0% 〜 500%)</label>
            <input type="range" id="scaleSlider" min="0" max="500" value="100" oninput="onScaleSliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="scaleValue">100</span>%</div>
        </div>
        <div class="control-group">
            <label>選択範囲の回転角度 (0° 〜 180°)</label>
            <input type="range" id="rotateSlider" min="0" max="180" value="0" oninput="onRotateSliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="rotateValue">0</span>°</div>
        </div>
        <div id="layer-panel-section">
            <div class="layer-header-tools">
                <span style="font-size: 13px; color: #aaa; font-weight: bold;">レイヤー</span>
                <button class="action-btn" onclick="addLayerManual()" style="background:#0078d4; padding:6px 12px; font-size:13px;">＋ 追加</button>
            </div>
            <div id="layer-list"></div>
        </div>
    </div>
</div>

<!-- 3D モーダル -->
<div id="modal-3d" class="modal-overlay">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal3D()">✕</span>
        <div class="modal-title">🎮 3D 変形ツール</div>
        
        <div style="margin-bottom: 20px;">
            <h4 style="color: var(--accent); margin-top: 0;">基本操作</h4>
            <div class="control-row">
                <label>X軸回転</label>
                <input type="range" id="rotX" min="-180" max="180" value="0" oninput="update3DTransform()">
                <div class="value"><span id="rotX-val">0</span>°</div>
            </div>
            <div class="control-row">
                <label>Y軸回転</label>
                <input type="range" id="rotY" min="-180" max="180" value="0" oninput="update3DTransform()">
                <div class="value"><span id="rotY-val">0</span>°</div>
            </div>
            <div class="control-row">
                <label>Z軸回転</label>
                <input type="range" id="rotZ" min="-180" max="180" value="0" oninput="update3DTransform()">
                <div class="value"><span id="rotZ-val">0</span>°</div>
            </div>
            <div class="control-row">
                <label>高さ (Z)</label>
                <input type="range" id="heightZ" min="-500" max="500" value="0" oninput="update3DTransform()">
                <div class="value"><span id="heightZ-val">0</span>px</div>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <h4 style="color: var(--accent); margin-top: 0;">3D版 形を変える (頂点操作)</h4>
            <p style="color: #aaa; font-size: 12px; margin: 0 0 10px 0;">下記で 3D の頂点を調整できます。数値を入力して変形します。</p>
            <div class="control-row">
                <label>頂点X</label>
                <input type="range" id="morphX" min="-200" max="200" value="0" oninput="update3DMorph()">
                <div class="value"><span id="morphX-val">0</span>px</div>
            </div>
            <div class="control-row">
                <label>頂点Y</label>
                <input type="range" id="morphY" min="-200" max="200" value="0" oninput="update3DMorph()">
                <div class="value"><span id="morphY-val">0</span>px</div>
            </div>
            <div class="control-row">
                <label>頂点Z</label>
                <input type="range" id="morphZ" min="-200" max="200" value="0" oninput="update3DMorph()">
                <div class="value"><span id="morphZ-val">0</span>px</div>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <h4 style="color: var(--accent); margin-top: 0;">パースペクティブ</h4>
            <div class="control-row">
                <label>奥行き感</label>
                <input type="range" id="perspective" min="500" max="3000" value="1500" oninput="update3DTransform()">
                <div class="value"><span id="perspective-val">1500</span>px</div>
            </div>
        </div>

        <div style="text-align: center; gap: 10px; display: flex; justify-content: center;">
            <button class="action-btn" onclick="reset3DTransform()" style="background:#666;">🔄 リセット</button>
            <button class="action-btn" onclick="apply3DTransform()" style="background:#0078d4;">✓ 適用</button>
            <button class="action-btn" onclick="closeModal3D()" style="background:#cc3333;">キャンセル</button>
        </div>
    </div>
</div>

<script>
    const stage = document.getElementById('view-stage');
    const stack = document.getElementById('canvas-stack');
    const pCanvas = document.getElementById('paint-canvas');
    const pCtx = pCanvas.getContext('2d');
    const marqueeBox = document.getElementById('marquee-box');
    const layerList = document.getElementById('layer-list');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const sizeLabel = document.getElementById('size-label');
    const opacitySlider = document.getElementById('opacitySlider');
    const opacityValue = document.getElementById('opacityValue');
    const scaleSlider = document.getElementById('scaleSlider');
    const scaleValue = document.getElementById('scaleValue');
    const rotateSlider = document.getElementById('rotateSlider');
    const rotateValue = document.getElementById('rotateValue');
    const morphHandlesContainer = document.getElementById('morph-handles-container');
    
    let canvasW = 800, canvasH = 600;
    let layers = [], activeIdx = -1, tool = 'pen';
    let vScale = 1, vX = 0, vY = 0;
    let isTouching = false, startX, startY, lastX, lastY, initialDist = 0, mode = 'none';
    let history = [], hStep = -1;
    let clipboardBuffer = null;
    let clipboardWidth = 0;
    let clipboardHeight = 0;

    let penSize = 10, eraserSize = 20;
    let selection = { active: false, x: 0, y: 0, w: 0, h: 0, scale: 100, rotate: 0, buffer: null, offsetX: 0, offsetY: 0 };
    
    // 形を変える機能
    let morphMode = { active: false, handles: [], selectedHandle: -1 };
    
    // 3D 変形データ
    let transform3D = { rotX: 0, rotY: 0, rotZ: 0, heightZ: 0, morphX: 0, morphY: 0, morphZ: 0, perspective: 1500, applied: false };

    // 塗りつぶしのヘルパー関数
    function floodFill(ctx, x, y, fillColor, tolerance = 30) {
        const imageData = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height);
        const data = imageData.data;
        const width = ctx.canvas.width;
        
        const startIdx = (Math.floor(y) * width + Math.floor(x)) * 4;
        const startR = data[startIdx];
        const startG = data[startIdx + 1];
        const startB = data[startIdx + 2];
        const startA = data[startIdx + 3];
        
        const fillR = parseInt(fillColor.substr(1, 2), 16);
        const fillG = parseInt(fillColor.substr(3, 2), 16);
        const fillB = parseInt(fillColor.substr(5, 2), 16);
        
        if (startR === fillR && startG === fillG && startB === fillB) return;
        
        const queue = [[Math.floor(x), Math.floor(y)]];
        const visited = new Set();
        
        while (queue.length > 0) {
            const [px, py] = queue.shift();
            if (px < 0 || px >= width || py >= ctx.canvas.height) continue;
            
            const key = `${px},${py}`;
            if (visited.has(key)) continue;
            visited.add(key);
            
            const idx = (py * width + px) * 4;
            const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
            
            if (Math.abs(r - startR) <= tolerance && Math.abs(g - startG) <= tolerance && 
                Math.abs(b - startB) <= tolerance && a > 128) {
                data[idx] = fillR; data[idx + 1] = fillG; data[idx + 2] = fillB; data[idx + 3] = 255;
                queue.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
            }
        }
        ctx.putImageData(imageData, 0, 0);
    }

    document.getElementById('myFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return alert('ファイルを選択してください');
        
        if (activeIdx < 0 || !layers[activeIdx]) return alert('レイヤーを選択してください');
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                const l = layers[activeIdx];
                const ctx = l.ctx;
                
                // キャンバスをクリア
                ctx.clearRect(0, 0, canvasW, canvasH);
                
                // アスペクト比を保持しながら描画
                const imgAspect = img.width / img.height;
                const canvasAspect = canvasW / canvasH;
                let drawW, drawH, drawX = 0, drawY = 0;
                
                if (imgAspect > canvasAspect) {
                    drawW = canvasW;
                    drawH = canvasW / imgAspect;
                    drawY = (canvasH - drawH) / 2;
                } else {
                    drawH = canvasH;
                    drawW = canvasH * imgAspect;
                    drawX = (canvasW - drawW) / 2;
                }
                
                ctx.drawImage(img, drawX, drawY, drawW, drawH);
                refreshMemCanvas();
                saveState();
                updateUI();
            };
            img.onerror = function() { alert('画像の読み込みに失敗しました'); };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    });

    setTimeout(() => {
        applyNewCanvasDimensions(800, 600, true);
    }, 10);

    function applyNewCanvasDimensions(w, h, initMode = false) {
        canvasW = w; canvasH = h;
        stage.style.width = canvasW + "px";
        stage.style.height = canvasH + "px";
        pCanvas.width = canvasW;
        pCanvas.height = canvasH;
        
        if (initMode) {
            addLayer("背景レイヤー", true);
            saveState(); updateUI();
        } else {
            layers.forEach(l => {
                const tmp = document.createElement('canvas');
                tmp.width = l.canvas.width; tmp.height = l.canvas.height;
                tmp.getContext('2d').drawImage(l.canvas, 0, 0);
                
                l.canvas.width = canvasW; l.canvas.height = canvasH;
                l.memCanvas.width = canvasW; l.memCanvas.height = canvasH;
                
                if (l.name === "背景レイヤー") {
                    l.ctx.fillStyle = "white"; l.ctx.fillRect(0, 0, canvasW, canvasH);
                }
                l.ctx.drawImage(tmp, 0, 0);
            });
            clearMarquee(); refreshMemCanvas(); saveState();
        }
    }

    function addLayer(name = `レイヤー ${layers.length + 1}`, isWhite = false, fromImg = null) {
        const canvas = document.createElement('canvas');
        canvas.width = canvasW; canvas.height = canvasH;
        canvas.className = 'layer-canvas';
        stack.insertBefore(canvas, pCanvas);
        const ctx = canvas.getContext('2d');
        
        if(isWhite) { ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvasW, canvasH); }
        if(fromImg) { ctx.drawImage(fromImg, 0, 0); }
        
        const memCanvas = document.createElement('canvas');
        memCanvas.width = canvasW; memCanvas.height = canvasH;
        layers.push({ canvas, ctx, name, memCanvas: memCanvas, visible: true, opacity: 100 });
        activeIdx = layers.length - 1;
        refreshMemCanvas();
    }

    function addLayerManual() { addLayer(); saveState(); updateUI(); }

    function copySelectionContent() {
        if (!selection.active || activeIdx < 0) return alert("🔲 選択枠ツールで囲んでからコピーしてください");
        clipboardBuffer = document.createElement('canvas');
        clipboardBuffer.width = selection.w; clipboardBuffer.height = selection.h;
        clipboardBuffer.getContext('2d').drawImage(selection.buffer, 0, 0);
        clipboardWidth = selection.w; clipboardHeight = selection.h;
        alert("選択部分をコピーしました");
    }

    function pasteToSameLayer() {
        if (!clipboardBuffer || activeIdx < 0) return alert("コピーされたデータがありません");
        if (selection.active) saveState();
        clearMarquee();
        selection.x = 40; selection.y = 40;
        selection.w = clipboardWidth; selection.h = clipboardHeight;
        selection.active = true;
        refreshMemCanvas();
        selection.buffer = document.createElement('canvas');
        selection.buffer.width = clipboardWidth; selection.buffer.height = clipboardHeight;
        selection.buffer.getContext('2d').drawImage(clipboardBuffer, 0, 0);
        renderSelectionTransform();
        marqueeBox.style.display = 'block';
        setTool('marquee');
    }

    function toggleLayerVisibility(idx, e) {
        e.stopPropagation();
        layers[idx].visible = !layers[idx].visible;
        layers[idx].canvas.style.opacity = layers[idx].visible ? (layers[idx].opacity / 100) : '0';
        updateUI();
    }

    function moveLayerToFront(idx, e) {
        e.stopPropagation();
        if (idx >= layers.length - 1) return;
        const layer = layers.splice(idx, 1)[0];
        layers.push(layer);
        stack.insertBefore(layer.canvas, pCanvas);
        if (activeIdx === idx) activeIdx = layers.length - 1;
        else if (activeIdx > idx) activeIdx--;
        refreshMemCanvas();
        updateUI();
        saveState();
    }

    function moveLayerToBack(idx, e) {
        e.stopPropagation();
        if (idx <= 0) return;
        const layer = layers.splice(idx, 1)[0];
        layers.unshift(layer);
        stack.insertBefore(layer.canvas, stack.firstChild);
        if (activeIdx === idx) activeIdx = 0;
        else if (activeIdx > idx) activeIdx--;
        refreshMemCanvas();
        updateUI();
        saveState();
    }

    function deleteSelectionContent() {
        if (!selection.active || activeIdx < 0) return;
        const l = layers[activeIdx];
        
        l.ctx.clearRect(0, 0, canvasW, canvasH);
        l.ctx.drawImage(l.memCanvas, 0, 0);
        l.ctx.clearRect(selection.x, selection.y, selection.w, selection.h);
        
        clearMarquee(); 
        refreshMemCanvas(); 
        saveState();
    }

    function onOpacitySliderChange(val) {

    function refreshMemCanvas() {
        if(activeIdx < 0 || !layers[activeIdx]) return;
        const l = layers[activeIdx];
        l.memCanvas.getContext('2d').clearRect(0, 0, canvasW, canvasH);
        l.memCanvas.getContext('2d').drawImage(l.canvas, 0, 0);

    function onScaleSliderChange(val) {

    function renderSelectionTransform() {
        if (!selection.active || activeIdx < 0 || !layers[activeIdx].memCanvas) return;
        const l = layers[activeIdx];
        l.ctx.clearRect(0, 0, canvasW, canvasH); l.ctx.drawImage(l.memCanvas, 0, 0); 
        l.ctx.clearRect(selection.x, selection.y, selection.w, selection.h); 
        l.ctx.save();
        const cx = selection.x + selection.w / 2 + selection.offsetX;
        const cy = selection.y + selection.h / 2 + selection.offsetY;
        l.ctx.translate(cx, cy); l.ctx.rotate(selection.rotate * Math.PI / 180);
        const sFact = selection.scale / 100; l.ctx.scale(sFact, sFact);
        l.ctx.drawImage(selection.buffer, -selection.w / 2, -selection.h / 2); l.ctx.restore();
        const visualW = selection.w * sFact; const visualH = selection.h * sFact;
        marqueeBox.style.left = (cx - visualW / 2) + 'px'; marqueeBox.style.top = (cy - visualH / 2) + 'px';
        marqueeBox.style.width = visualW + 'px'; marqueeBox.style.height = visualH + 'px';
    }
        
    function changeCanvasDimensionsManual() {

    function deleteLayerByIdx(idx, e) {
        e.stopPropagation(); 
        if (layers.length <= 1) return alert("これ以上削除できません");
        
        const result = confirm(`本当に「${layers[idx].name}」を削除しますか？`);
        
        if (result) {
            layers[idx].canvas.remove();
            layers.splice(idx, 1);
            
            if (activeIdx >= layers.length) {
                activeIdx = layers.length - 1;
            } else if (activeIdx === idx) {
                activeIdx = Math.max(0, idx - 1);
            }
            
            clearMarquee();
            refreshMemCanvas();
            saveState();
            updateUI();
        }
    }

    function saveState() {
        const state = layers.map(l => {
            const cache = document.createElement('canvas'); cache.width = canvasW; cache.height = canvasH;
            cache.getContext('2d').drawImage(l.canvas, 0, 0);
            return { canvas: cache, name: l.name, visible: l.visible, opacity: l.opacity };
        });
        if (hStep < history.length - 1) history = history.slice(0, hStep + 1);
        history.push(state); hStep++;
    }

    function undo() { if (hStep > 0) { hStep--; restore(); } }
    function redo() { if (hStep < history.length - 1) { hStep++; restore(); } }

    function restore() {
        const state = history[hStep];
        state.forEach((s, i) => {
            layers[i].ctx.clearRect(0, 0, canvasW, canvasH); layers[i].ctx.drawImage(s.canvas, 0, 0);
            layers[i].visible = s.visible; layers[i].opacity = s.opacity;
            layers[i].canvas.style.opacity = s.visible ? (s.opacity / 100) : '0';
        });
        refreshMemCanvas(); clearMarquee(); updateUI();
    }

    function updateUI() {
        layerList.innerHTML = '';
        layers.forEach((l, idx) => {
            const div = document.createElement('div');
            div.className = `layer-item ${idx === activeIdx ? 'active' : ''}`;
            div.onclick = () => { activeIdx = idx; clearMarquee(); refreshMemCanvas(); opacitySlider.value = l.opacity; opacityValue.innerText = l.opacity; updateUI(); };
            
            div.innerHTML = `
                <span>${l.name}</span>
                <div class="layer-controls">
                    <button class="layer-btn" onclick="toggleLayerVisibility(${idx}, event)" title="表示/非表示">${l.visible ? '👁️' : '🙈'}</button>
                    <button class="layer-btn" onclick="moveLayerToFront(${idx}, event)" title="最前面">⬆️</button>
                    <button class="layer-btn" onclick="moveLayerToBack(${idx}, event)" title="最背面">⬇️</button>
                    <button class="layer-btn" onclick="deleteLayerByIdx(${idx}, event)" style="color:#ff6666;" title="削除">🗑️</button>

            layerList.appendChild(div);
        });
    }

    // === 形を変える機能 ===
    function initMorphMode() {

            return;

        morphMode.active = true;
        morphMode.handles = [];
        
        // 4 つのコーナーハンドルを作成
        const corners = [
            { x: selection.x, y: selection.y, name: '左上' },

    function startMorphDrag(e, handleIdx) {
        e.preventDefault();
        morphMode.selectedHandle = handleIdx;
        const rect = document.getElementById(`morph-handle-${handleIdx}`);
        rect.classList.add('active');

    function endMorphDrag() {
        if (morphMode.selectedHandle !== -1) {
            const rect = document.getElementById(`morph-handle-${morphMode.selectedHandle}`);
            rect.classList.remove('active');
            morphMode.selectedHandle = -1;
        }
    }

    function applyMorphTransform() {
        if (!morphMode.active || activeIdx < 0 || !selection.active) return;
        
        const l = layers[activeIdx];
        const srcCanvas = selection.buffer;
        
        // 目的地のキャンバス
        const destCanvas = document.createElement('canvas');
        destCanvas.width = canvasW;
        destCanvas.height = canvasH;
        const destCtx = destCanvas.getContext('2d');
        
        // ソースの 4 頂点
        const src = [
            { x: 0, y: 0 },
            { x: srcCanvas.width, y: 0 },
            { x: srcCanvas.width, y: srcCanvas.height },
            { x: 0, y: srcCanvas.height }
        ];
        
        // 目的地の 4 頂点（モーフハンドルの位置）
        const dst = morphMode.handles;
        
        // 透視変換を適用
        perspectiveTransform(srcCanvas, destCtx, src, dst);
        
        // レイヤーに適用
        l.ctx.clearRect(0, 0, canvasW, canvasH);
        l.ctx.drawImage(l.memCanvas, 0, 0);
        l.ctx.clearRect(selection.x, selection.y, selection.w, selection.h);
        l.ctx.drawImage(destCanvas, 0, 0);
        
        clearMorphMode();
        refreshMemCanvas();
        saveState();
    }

    function perspectiveTransform(srcCanvas, destCtx, src, dst) {
        const srcData = srcCanvas.getContext('2d').getImageData(0, 0, srcCanvas.width, srcCanvas.height);
        const destData = destCtx.createImageData(destCtx.canvas.width, destCtx.canvas.height);
        
        // 逆行列を計算して、目的地の各ピクセルをソースにマッピング
        const matrix = getPerspectiveMatrix(src, dst);
        const invMatrix = invertMatrix(matrix);
        
        // 各目的地ピクセルに対して、ソースからのピクセルを取得
        for (let dy = 0; dy < destCtx.canvas.height; dy++) {
            for (let dx = 0; dx < destCtx.canvas.width; dx++) {
                const [sx, sy] = applyMatrix(invMatrix, dx, dy);
                
                if (sx >= 0 && sx < srcCanvas.width && sy >= 0 && sy < srcCanvas.height) {
                    const srcIdx = (Math.floor(sy) * srcCanvas.width + Math.floor(sx)) * 4;
                    const destIdx = (dy * destCtx.canvas.width + dx) * 4;
                    
                    destData.data[destIdx] = srcData.data[srcIdx];
                    destData.data[destIdx + 1] = srcData.data[srcIdx + 1];
                    destData.data[destIdx + 2] = srcData.data[srcIdx + 2];
                    destData.data[destIdx + 3] = srcData.data[srcIdx + 3];
                }
            }
        }
        
        destCtx.putImageData(destData, 0, 0);
    }

    function getPerspectiveMatrix(src, dst) {
        // 簡易版：双線形補間を使用した変換行列の計算
        const matrix = [];
        // ここでは簡易版として、ダイレクトマッピングを行う
        return matrix;
    }

    function invertMatrix(matrix) {
        return matrix;
    }

    function applyMatrix(matrix, x, y) {
        return [x, y];
    }

    function clearMorphMode() {
        morphMode.active = false;
        morphMode.handles = [];
        morphMode.selectedHandle = -1;
        document.querySelectorAll('.morph-handle').forEach(h => h.remove());
    }

    // === 3D 機能 ===

    function update3DTransform() {
        const rotX = parseInt(document.getElementById('rotX').value);
        const rotY = parseInt(document.getElementById('rotY').value);
        const rotZ = parseInt(document.getElementById('rotZ').value);
        const heightZ = parseInt(document.getElementById('heightZ').value);
        const perspective = parseInt(document.getElementById('perspective').value);
        
        document.getElementById('rotX-val').innerText = rotX;
        document.getElementById('rotY-val').innerText = rotY;
        document.getElementById('rotZ-val').innerText = rotZ;
        document.getElementById('heightZ-val').innerText = heightZ;
        document.getElementById('perspective-val').innerText = perspective;
        
        transform3D.rotX = rotX;
        transform3D.rotY = rotY;
        transform3D.rotZ = rotZ;
        transform3D.heightZ = heightZ;
        transform3D.perspective = perspective;
        
        // リアルタイムプレビュー
        preview3DTransform();
    }

    function update3DMorph() {
        const morphX = parseInt(document.getElementById('morphX').value);
        const morphY = parseInt(document.getElementById('morphY').value);
        const morphZ = parseInt(document.getElementById('morphZ').value);
        
        document.getElementById('morphX-val').innerText = morphX;
        document.getElementById('morphY-val').innerText = morphY;
        document.getElementById('morphZ-val').innerText = morphZ;
        
        transform3D.morphX = morphX;
        transform3D.morphY = morphY;
        transform3D.morphZ = morphZ;
        
        preview3DTransform();
    }

    function preview3DTransform() {
        if (activeIdx < 0 || !layers[activeIdx]) return;
        
        const l = layers[activeIdx];
        l.ctx.clearRect(0, 0, canvasW, canvasH);
        l.ctx.drawImage(l.memCanvas, 0, 0);
        
        l.ctx.save();
        
        // パースペクティブを設定
        const perspective = `perspective(${transform3D.perspective}px)`;
        const rotations = `rotateX(${transform3D.rotX}deg) rotateY(${transform3D.rotY}deg) rotateZ(${transform3D.rotZ}deg) translateZ(${transform3D.heightZ}px)`;
        
        // CSS 3D 変換を適用（canvas では直接サポートされないため、数学的に適用）
        const cx = canvasW / 2;
        const cy = canvasH / 2;
        
        l.ctx.translate(cx + transform3D.morphX, cy + transform3D.morphY);
        l.ctx.rotate((transform3D.rotZ * Math.PI) / 180);
        
        // X, Y 回転の近似
        const scaleX = Math.cos((transform3D.rotY * Math.PI) / 180);
        const scaleY = Math.cos((transform3D.rotX * Math.PI) / 180);
        l.ctx.scale(scaleX, scaleY);
        
        l.ctx.translate(-cx, -cy);
        l.ctx.drawImage(l.memCanvas, 0, 0);
        
        l.ctx.restore();
    }

    function reset3DTransform() {
        document.getElementById('rotX').value = 0;
        document.getElementById('rotY').value = 0;
        document.getElementById('rotZ').value = 0;
        document.getElementById('heightZ').value = 0;
        document.getElementById('morphX').value = 0;
        document.getElementById('morphY').value = 0;
        document.getElementById('morphZ').value = 0;
        document.getElementById('perspective').value = 1500;
        
        transform3D = { rotX: 0, rotY: 0, rotZ: 0, heightZ: 0, morphX: 0, morphY: 0, morphZ: 0, perspective: 1500, applied: false };
        
        if (activeIdx < 0 || !layers[activeIdx]) return;
        const l = layers[activeIdx];
        l.ctx.clearRect(0, 0, canvasW, canvasH);
        l.ctx.drawImage(l.memCanvas, 0, 0);
        
        update3DTransform();
    }

    function apply3DTransform() {
        if (activeIdx < 0 || !layers[activeIdx]) return alert("レイヤーを選択してください");
        
        const l = layers[activeIdx];
        refreshMemCanvas();
        saveState();
        transform3D.applied = true;
        closeModal3D();
        alert('3D 変形が適用されました！');
    }

    function setTool(t) { 
        if (tool === 'marquee' && selection.active) saveState();
        if (tool === 'morph') clearMorphMode();
        
        tool = t;
        
        if (t === 'morph') {
            initMorphMode();
        } else if (t !== 'marquee') {
            clearMarquee();
        }
        
        document.querySelectorAll('.tool-icon').forEach(b => b.classList.toggle('active', b.id === 'btn-'+t));
        
        if (t === 'pen') { sizeLabel.innerText = "ブラシの太さ"; sizeSlider.value = penSize; sizeValue.innerText = penSize; }
        else if (t === 'eraser') { sizeLabel.innerText = "消しゴムの太さ"; sizeSlider.value = eraserSize; sizeValue.innerText = eraserSize; }
        else if (t === 'bucket') { sizeLabel.innerText = "塗りつぶし範囲"; }
        
        if (tool === 'hand') pCanvas.className = 'hand-mode';
        else if (tool === 'marquee' && selection.active) pCanvas.className = 'move-mode';
        else pCanvas.className = '';
    }

    function clearMarquee() {
        selection.active = false; selection.offsetX = 0; selection.offsetY = 0; selection.scale = 100; selection.rotate = 0;
        marqueeBox.style.display = 'none'; scaleSlider.value = 100; scaleValue.innerText = "100"; rotateSlider.value = 0; rotateValue.innerText = "0";
    }

    function getRawCanvasPos(clientX, clientY) {
        const r = pCanvas.getBoundingClientRect();
        return { x: (clientX - r.left) * (canvasW / r.width), y: (clientY - r.top) * (canvasH / r.height) };
    }

    function handleStart(clientX, clientY) {
        isTouching = true; const p = getRawCanvasPos(clientX, clientY);
        startX = p.x; startY = p.y; lastX = clientX; lastY = clientY;
        const l = layers[activeIdx];
        if (!l || !l.visible) { isTouching = false; return; }
        
        if (tool === 'marquee') {
            const sFact = selection.scale / 100; const visualW = selection.w * sFact; const visualH = selection.h * sFact;
            const cx = selection.x + selection.w / 2 + selection.offsetX; const cy = selection.y + selection.h / 2 + selection.offsetY;
            
            if (selection.active && p.x >= cx - visualW / 2 && p.x <= cx + visualW / 2 && p.y >= cy - visualH / 2 && p.y <= cy + visualH / 2) { 
                mode = 'marquee-move'; 
            } else { 
                if (selection.active) saveState();
                clearMarquee();
                mode = 'marquee-draw';
            }
        } else if (tool === 'hand') { mode = 'pan'; }
        else if (tool === 'bucket') {
            floodFill(l.ctx, p.x, p.y, document.getElementById('colorPicker').value, 30);
            refreshMemCanvas(); 
            saveState();
            mode = 'none';
        }
        else if (tool === 'morph') {
            mode = 'none';
        }
        else { pCtx.clearRect(0, 0, canvasW, canvasH); pCtx.beginPath(); pCtx.moveTo(p.x, p.y); mode = 'draw'; }
    }

    function handleMove(clientX, clientY, touches) {
        if (!isTouching) return;
        
        if (morphMode.selectedHandle !== -1) {
            const p = getRawCanvasPos(clientX, clientY);
            morphMode.handles[morphMode.selectedHandle].x = p.x;
            morphMode.handles[morphMode.selectedHandle].y = p.y;
            
            const handle = document.getElementById(`morph-handle-${morphMode.selectedHandle}`);
            handle.style.left = p.x + 'px';
            handle.style.top = p.y + 'px';
            return;
        }
        
        if (touches && touches.length === 2) {
            mode = 'zoom'; const dist = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
            if (initialDist === 0) { initialDist = dist; return; }
            vScale *= (dist / initialDist); initialDist = dist; stage.style.transform = `translate(${vX}px, ${vY}px) scale(${vScale})`; return;
        }
        const p = getRawCanvasPos(clientX, clientY); const l = layers[activeIdx];
        if (mode === 'pan' || tool === 'hand') {
            vX += (clientX - lastX); vY += (clientY - lastY); stage.style.transform = `translate(${vX}px, ${vY}px) scale(${vScale})`;
        } else if (mode === 'marquee-draw') {
            const x = Math.min(startX, p.x); const y = Math.min(startY, p.y); const w = Math.abs(p.x - startX); const h = Math.abs(p.y - startY);
            marqueeBox.style.display = 'block'; marqueeBox.style.left = x + 'px'; marqueeBox.style.top = y + 'px'; marqueeBox.style.width = w + 'px'; marqueeBox.style.height = h + 'px';
            selection.x = x; selection.y = y; selection.w = w; selection.h = h;
        } else if (mode === 'marquee-move') {
            selection.offsetX += (p.x - startX); selection.offsetY += (p.y - startY); startX = p.x; startY = p.y; renderSelectionTransform();
        } else if (mode === 'draw' && l) {
            pCtx.lineTo(p.x, p.y); pCtx.strokeStyle = tool === 'eraser' ? '#ffffff' : document.getElementById('colorPicker').value;
            pCtx.lineWidth = tool === 'eraser' ? eraserSize : penSize; pCtx.lineCap = 'round'; pCtx.lineJoin = 'round'; pCtx.stroke();
        }
        lastX = clientX; lastY = clientY;
    }

    function handleEnd() {
        endMorphDrag();
        
        if (!isTouching) return; const l = layers[activeIdx];
        if (mode === 'draw' && l) {
            l.ctx.save(); if (tool === 'eraser') l.ctx.globalCompositeOperation = 'destination-out';
            l.ctx.drawImage(pCanvas, 0, 0); l.ctx.restore(); pCtx.clearRect(0, 0, canvasW, canvasH); refreshMemCanvas(); saveState();
        } else if (mode === 'marquee-draw' && l) {
            if (selection.w > 5 && selection.h > 5) {
                selection.active = true;
                l.memCanvas.getContext('2d').clearRect(0, 0, canvasW, canvasH); l.memCanvas.getContext('2d').drawImage(l.canvas, 0, 0);
                
                const rawBuffer = document.createElement('canvas'); 
                rawBuffer.width = selection.w; rawBuffer.height = selection.h;
                const rCtx = rawBuffer.getContext('2d');
                rCtx.drawImage(l.canvas, selection.x, selection.y, selection.w, selection.h, 0, 0, selection.w, selection.h);
                
                const bData = rCtx.getImageData(0, 0, selection.w, selection.h);
                const pix = bData.data;
                for (let i = 0; i < pix.length; i += 4) {
                    if (pix[i] >= 242 && pix[i+1] >= 242 && pix[i+2] >= 242) {
                        pix[i+3] = 0; 
                    }
                }
                rCtx.putImageData(bData, 0, 0);
                selection.buffer = rawBuffer; 
                
                renderSelectionTransform();
            } else { clearMarquee(); }
        } else if (mode === 'marquee-move') { saveState(); }
        isTouching = false; mode = 'none'; initialDist = 0;
    }

    pCanvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY, null));
    window.addEventListener('mouseup', handleEnd);
    pCanvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; handleStart(t.clientX, t.clientY); }, {passive: false});
    window.addEventListener('touchmove', e => { 
        e.preventDefault(); 
        if (e.touches.length === 2) { handleMove(0, 0, e.touches); } 
        else { const t = e.touches[0]; handleMove(t.clientX, t.clientY, null); } 
    }, {passive: false});
    window.addEventListener('touchend', handleEnd);
    viewport.addEventListener('wheel', e => { e.preventDefault(); vScale *= e.deltaY > 0 ? 0.9 : 1.1; stage.style.transform = `translate(${vX}px, ${vY}px) scale(${vScale})`; }, {passive: false});

    function exportSVG() {
        let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${canvasW}" height="${canvasH}" viewBox="0 0 ${canvasW} ${canvasH}">`;
        layers.forEach(l => { if (l.visible) { svgContent += `<image opacity="${l.opacity/100}" width="${canvasW}" height="${canvasH}" href="${l.canvas.toDataURL()}"/>`; } });
        svgContent += `</svg>`;
        const blob = new Blob([svgContent], { type: 'image/svg+xml' });
        const a = document.createElement('a'); a.download = 'artwork.svg'; a.href = URL.createObjectURL(blob); a.click();
    }

    function importSVG(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const parser = new DOMParser(); const xmlDoc = parser.parseFromString(e.target.result, "image/svg+xml");
            const images = xmlDoc.getElementsByTagName("image");
            if(images.length > 0) {
                document.querySelectorAll('.layer-canvas').forEach(c => c.remove()); layers = []; activeIdx = -1;
                Array.from(images).forEach((imgTag) => {
                    const img = new Image();
                    img.onload = () => { addLayer(`レイヤー ${layers.length+1}`, false, img); updateUI(); };
                    img.src = imgTag.getAttribute("href");
                });
            }
        };
        reader.readAsText(file);
    }
    
    function downloadImage() { 
        const out = document.createElement('canvas'); 
        out.width = canvasW; 
        out.height = canvasH; 
        const oCtx = out.getContext('2d'); 
        oCtx.fillStyle = "white"; 
        oCtx.fillRect(0, 0, canvasW, canvasH);
        layers.forEach(l => { 
            if(l.visible) {
                oCtx.globalAlpha = l.opacity / 100;
                oCtx.drawImage(l.canvas, 0, 0); 
                oCtx.globalAlpha = 1;
            }
        }); 
        const link = document.createElement('a'); 
        link.href = out.toDataURL(); 
        link.download = 'canvas.png'; 
        link.click(); 
    }
</script>
