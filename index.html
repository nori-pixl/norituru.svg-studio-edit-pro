<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>svg studio edit pro</title></title>
    <style>
        :root { --bg: #1e1e1e; --panel: #333; --accent: #0078d4; --text: #eee; --border: #444; }
        body { margin: 0; background: #282828; color: var(--text); font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
        header { background: var(--bg); height: 60px; display: flex; align-items: center; padding: 0 15px; border-bottom: 2px solid var(--border); gap: 10px; z-index: 1000; overflow-x: auto; }
        #main { flex: 1; display: flex; overflow: hidden; }
        #sidebar { width: 75px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 15px; gap: 15px; z-index: 1000; overflow-y: auto; }
        .tool-icon { width: 55px; height: 55px; background: none; border: none; color: white; cursor: pointer; font-size: 30px; border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .tool-icon:hover { background: #555; }
        .tool-icon.active { background: var(--accent); }
        
        /* Photoshop型のグレー余白付きワークスペース */
        #viewport { flex: 1; position: relative; overflow: hidden; background: #191919; touch-action: none; display: flex; align-items: center; justify-content: center; }
        #view-stage { position: relative; transform-origin: center center; overflow: hidden !important; box-shadow: 0 0 30px rgba(0,0,0,0.8); background: #ffffff; }
        #canvas-stack { width: 100%; height: 100%; position: relative; }
        
        canvas.layer-canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; display: block; pointer-events: none; background: transparent !important; }
        #paint-canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; pointer-events: auto !important; z-index: 1000; cursor: crosshair; background: transparent !important; }
        #paint-canvas.hand-mode { cursor: grab; }
        #paint-canvas.move-mode { cursor: move; }
        #marquee-box { position: absolute; border: 2px dashed #fff; outline: 1px solid #000; display: none; z-index: 2000; pointer-events: none; }
        
        #right-panel { width: 280px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
        .control-group { padding: 12px; border-bottom: 1px solid #444; font-size: 13px; }
        .control-group label { display: block; margin-bottom: 8px; color: #aaa; }
        #layer-panel-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .layer-header-tools { padding: 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #444; }
        #layer-list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column-reverse; }
        .layer-item { background: #444; margin: 4px 0; padding: 12px; font-size: 14px; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
        .layer-item.active { background: var(--accent); border: 1px solid white; }
        .layer-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .layer-btn { background: none; border: none; color: white; cursor: pointer; font-size: 14px; padding: 2px 4px; }
        .layer-btn:hover { color: var(--accent); }
        .action-btn { background: #555; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 12px; font-size: 16px; font-weight: bold; transition: 0.2s; }
        .action-btn:hover { background: #666; }
        input[type="range"] { width: 100%; }
        .hidden-file { display: none; }
        .divider { width: 45px; border-top: 1px solid #555; }
    </style>
</head>
<body>

<header>
    <h4>Svg Studio Edit <span style="color:red;">Pro</span></h4>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <button class="action-btn" onclick="undo()">↩️</button>
    <button class="action-btn" onclick="redo()">↪️</button>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <button class="action-btn" style="background:#0078d4;" onclick="changeCanvasDimensionsManual()">キャンバスサイズ</button>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <button class="action-btn" style="background:#cc3333;" onclick="deleteSelectionContent()">範囲削除</button>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <input type="file" id="myFile" accept="image/*" style="display:none;"><button class="action-btn" onclick="document.getElementById('myFile').click()">画像を追加</button>
    <button class="action-btn" style="background:#444;" onclick="exportSVG()">svg　書き込み</button>
    <button class="action-btn" style="background:#444;" onclick="document.getElementById('svg-loader').click()">svg 読み取り</button>
    <input type="file" id="svg-loader" class="hidden-file" accept=".svg" onchange="importSVG(this)">
    <button class="action-btn" onclick="downloadImage()" style="margin-left:auto; background: #0078d4;">pngで書き込み</button>
</header>

<div id="main">
    <div id="sidebar">
        <button class="tool-icon active" id="btn-pen" onclick="setTool('pen')" title="Pen Tool">🖌️</button>
        <button class="tool-icon" id="btn-eraser" onclick="setTool('eraser')" title="Eraser Tool">🧽</button>
        <button class="tool-icon" id="btn-bucket" onclick="setTool('bucket')" title="Bucket Fill">🪣</button>
        <button class="tool-icon" id="btn-marquee" onclick="setTool('marquee')" title="Selection Tool">🔲</button>
        <button class="tool-icon" id="btn-hand" onclick="setTool('hand')" title="Hand Tool">✋</button>
        <div class="divider"></div>
        <button class="tool-icon" style="background:#444; font-size:22px;" onclick="copySelectionContent()" title="Copy Selection">✂️</button>
        <button class="tool-icon" style="background:#444; font-size:22px;" onclick="pasteToSameLayer()" title="Paste">📋</button>
        <div class="divider"></div>
        <input type="color" id="colorPicker" value="#000000" style="width:50px; height:40px; cursor:pointer; border-radius:8px;">
    </div>

    <div id="viewport">
        <div id="view-stage">
            <div id="canvas-stack">
                <canvas id="paint-canvas"></canvas>
            </div>
            <div id="marquee-box"></div>
        </div>
    </div>

    <div id="right-panel">
        <div class="control-group">
            <label id="size-label">筆サイズ</label>
            <input type="range" id="sizeSlider" min="1" max="100" value="10" oninput="onSizeSliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="sizeValue">10</span>px</div>
        </div>
        <div class="control-group">
            <label>レイヤーの不透明度</label>
            <input type="range" id="opacitySlider" min="0" max="100" value="100" oninput="onOpacitySliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="opacityValue">100</span>%</div>
        </div>
        <div class="control-group">
            <label>選抜尺度 (0% - 500%)</label>
            <input type="range" id="scaleSlider" min="0" max="500" value="100" oninput="onScaleSliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="scaleValue">100</span>%</div>
        </div>
        <div class="control-group">
            <label>角度 (0° - 180°)</label>
            <input type="range" id="rotateSlider" min="0" max="180" value="0" oninput="onRotateSliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="rotateValue">0</span>°</div>
        </div>
        <div id="layer-panel-section">
            <div class="layer-header-tools">
                <span style="font-size: 13px; color: #aaa; font-weight: bold;">レイヤー</span>
                <button class="action-btn" onclick="addLayerManual()" style="background:#0078d4; padding:6px 12px; font-size:13px;">追加</button>
            </div>
            <div id="layer-list"></div>
        </div>
    </div>
</div>

<script>
    const stage = document.getElementById('view-stage');
    const stack = document.getElementById('canvas-stack');
    const pCanvas = document.getElementById('paint-canvas');
    const pCtx = pCanvas.getContext('2d');
    const marqueeBox = document.getElementById('marquee-box');
    const layerList = document.getElementById('layer-list');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const sizeLabel = document.getElementById('size-label');
    const opacitySlider = document.getElementById('opacitySlider');
    const opacityValue = document.getElementById('opacityValue');
    const scaleSlider = document.getElementById('scaleSlider');
    const scaleValue = document.getElementById('scaleValue');
    const rotateSlider = document.getElementById('rotateSlider');
    const rotateValue = document.getElementById('rotateValue');
    
    let canvasW = 800, canvasH = 600;
    let layers = [], activeIdx = -1, tool = 'pen';
    let vScale = 1, vX = 0, vY = 0;
    let isTouching = false, startX, startY, lastX, lastY, initialDist = 0, mode = 'none';
    let history = [], hStep = -1;
    let clipboardBuffer = null;
    let clipboardWidth = 0;
    let clipboardHeight = 0;

    let penSize = 10, eraserSize = 20;
    let selection = { active: false, x: 0, y: 0, w: 0, h: 0, scale: 100, rotate: 0, buffer: null, offsetX: 0, offsetY: 0 };

    // Flood fill helper
    function floodFill(ctx, x, y, fillColor, tolerance = 30) {
        const imageData = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height);
        const data = imageData.data;
        const width = ctx.canvas.width;
        
        const startIdx = (Math.floor(y) * width + Math.floor(x)) * 4;
        const startR = data[startIdx];
        const startG = data[startIdx + 1];
        const startB = data[startIdx + 2];
        const startA = data[startIdx + 3];
        
        const fillR = parseInt(fillColor.substr(1, 2), 16);
        const fillG = parseInt(fillColor.substr(3, 2), 16);
        const fillB = parseInt(fillColor.substr(5, 2), 16);
        
        if (startR === fillR && startG === fillG && startB === fillB) return;
        
        const queue = [[Math.floor(x), Math.floor(y)]];
        const visited = new Set();
        
        while (queue.length > 0) {
            const [px, py] = queue.shift();
            if (px < 0 || px >= width || py >= ctx.canvas.height) continue;
            
            const key = `${px},${py}`;
            if (visited.has(key)) continue;
            visited.add(key);
            
            const idx = (py * width + px) * 4;
            const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
            
            if (Math.abs(r - startR) <= tolerance && Math.abs(g - startG) <= tolerance && 
                Math.abs(b - startB) <= tolerance && a > 128) {
                data[idx] = fillR; data[idx + 1] = fillG; data[idx + 2] = fillB; data[idx + 3] = 255;
                queue.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
            }
        }
        ctx.putImageData(imageData, 0, 0);
    }

    document.getElementById('myFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return alert('Please select a file');
        
        if (activeIdx < 0 || !layers[activeIdx]) return alert('Please select a layer');
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                const l = layers[activeIdx];
                const ctx = l.ctx;
                
                // Clear layer
                ctx.clearRect(0, 0, canvasW, canvasH);
                
                // Calculate aspect-fit dimensions
                const imgAspect = img.width / img.height;
                const canvasAspect = canvasW / canvasH;
                let drawW, drawH, drawX = 0, drawY = 0;
                
                if (imgAspect > canvasAspect) {
                    drawW = canvasW;
                    drawH = canvasW / imgAspect;
                    drawY = (canvasH - drawH) / 2;
                } else {
                    drawH = canvasH;
                    drawW = canvasH * imgAspect;
                    drawX = (canvasW - drawW) / 2;
                }
                
                ctx.drawImage(img, drawX, drawY, drawW, drawH);
                refreshMemCanvas();
                saveState();
                updateUI();
            };
            img.onerror = function() { alert('Failed to load image'); };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    });

    setTimeout(() => {
        applyNewCanvasDimensions(800, 600, true);
    }, 10);

    function applyNewCanvasDimensions(w, h, initMode = false) {
        canvasW = w; canvasH = h;
        stage.style.width = canvasW + "px";
        stage.style.height = canvasH + "px";
        pCanvas.width = canvasW;
        pCanvas.height = canvasH;
        
        if (initMode) {
            addLayer("Background", true);
            saveState(); updateUI();
        } else {
            layers.forEach(l => {
                const tmp = document.createElement('canvas');
                tmp.width = l.canvas.width; tmp.height = l.canvas.height;
                tmp.getContext('2d').drawImage(l.canvas, 0, 0);
                
                l.canvas.width = canvasW; l.canvas.height = canvasH;
                l.memCanvas.width = canvasW; l.memCanvas.height = canvasH;
                
                if (l.name === "Background") {
                    l.ctx.fillStyle = "white"; l.ctx.fillRect(0, 0, canvasW, canvasH);
                }
                l.ctx.drawImage(tmp, 0, 0);
            });
            clearMarquee(); refreshMemCanvas(); saveState();
        }
    }

    function addLayer(name = `Layer ${layers.length + 1}`, isWhite = false, fromImg = null) {
        const canvas = document.createElement('canvas');
        canvas.width = canvasW; canvas.height = canvasH;
        canvas.className = 'layer-canvas';
        stack.insertBefore(canvas, pCanvas);
        const ctx = canvas.getContext('2d');
        
        if(isWhite) { ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvasW, canvasH); }
        if(fromImg) { ctx.drawImage(fromImg, 0, 0); }
        
        const memCanvas = document.createElement('canvas');
        memCanvas.width = canvasW; memCanvas.height = canvasH;
        layers.push({ canvas, ctx, name, memCanvas: memCanvas, visible: true, opacity: 100 });
        activeIdx = layers.length - 1;
        refreshMemCanvas();
    }

    function addLayerManual() { addLayer(); saveState(); updateUI(); }

    function copySelectionContent() {
        if (!selection.active || activeIdx < 0) return alert("🔲 Make a selection first");
        clipboardBuffer = document.createElement('canvas');
        clipboardBuffer.width = selection.w; clipboardBuffer.height = selection.h;
        clipboardBuffer.getContext('2d').drawImage(selection.buffer, 0, 0);
        clipboardWidth = selection.w; clipboardHeight = selection.h;
        alert("Selection copied!");
    }

    function pasteToSameLayer() {
        if (!clipboardBuffer || activeIdx < 0) return alert("No copied data");
        if (selection.active) saveState();
        clearMarquee();
        selection.x = 40; selection.y = 40;
        selection.w = clipboardWidth; selection.h = clipboardHeight;
        selection.active = true;
        refreshMemCanvas();
        selection.buffer = document.createElement('canvas');
        selection.buffer.width = clipboardWidth; selection.buffer.height = clipboardHeight;
        selection.buffer.getContext('2d').drawImage(clipboardBuffer, 0, 0);
        renderSelectionTransform();
        marqueeBox.style.display = 'block';
        setTool('marquee');
    }

    function toggleLayerVisibility(idx, e) {
        e.stopPropagation();
        layers[idx].visible = !layers[idx].visible;
        layers[idx].canvas.style.opacity = layers[idx].visible ? (layers[idx].opacity / 100) : '0';
        updateUI();
    }

    function moveLayerToFront(idx, e) {
        e.stopPropagation();
        if (idx >= layers.length - 1) return;
        const layer = layers.splice(idx, 1)[0];
        layers.push(layer);
        stack.insertBefore(layer.canvas, pCanvas);
        if (activeIdx === idx) activeIdx = layers.length - 1;
        else if (activeIdx > idx) activeIdx--;
        refreshMemCanvas();
        updateUI();
        saveState();
    }

    function moveLayerToBack(idx, e) {
        e.stopPropagation();
        if (idx <= 0) return;
        const layer = layers.splice(idx, 1)[0];
        layers.unshift(layer);
        stack.insertBefore(layer.canvas, stack.firstChild);
        if (activeIdx === idx) activeIdx = 0;
        else if (activeIdx > idx) activeIdx--;
        refreshMemCanvas();
        updateUI();
        saveState();
    }

    function deleteSelectionContent() {
        if (!selection.active || activeIdx < 0) return;
        const l = layers[activeIdx];
        
        l.ctx.clearRect(0, 0, canvasW, canvasH);
        l.ctx.drawImage(l.memCanvas, 0, 0);
        l.ctx.clearRect(selection.x, selection.y, selection.w, selection.h);
        
        clearMarquee(); 
        refreshMemCanvas(); 
        saveState();
    }

    function onSizeSliderChange(val) {
        const v = parseInt(val); sizeValue.innerText = v;
        if (tool === 'pen') penSize = v; else if (tool === 'eraser') eraserSize = v;
    }

    function onOpacitySliderChange(val) {
        if (activeIdx < 0) return;
        const v = parseInt(val);
        opacityValue.innerText = v;
        layers[activeIdx].opacity = v;
        layers[activeIdx].canvas.style.opacity = layers[activeIdx].visible ? (v / 100) : '0';
    }

    function refreshMemCanvas() {
        if(activeIdx < 0 || !layers[activeIdx]) return;
        const l = layers[activeIdx];
        l.memCanvas.getContext('2d').clearRect(0, 0, canvasW, canvasH);
        l.memCanvas.getContext('2d').drawImage(l.canvas, 0, 0);
    }

    function onScaleSliderChange(val) {
        if (!selection.active) return;
        selection.scale = parseInt(val); scaleValue.innerText = val;
        renderSelectionTransform();
    }

    function onRotateSliderChange(val) {
        if (!selection.active) return;
        selection.rotate = parseInt(val); rotateValue.innerText = val;
        renderSelectionTransform();
    }

    function renderSelectionTransform() {
        if (!selection.active || activeIdx < 0 || !layers[activeIdx].memCanvas) return;
        const l = layers[activeIdx];
        l.ctx.clearRect(0, 0, canvasW, canvasH); l.ctx.drawImage(l.memCanvas, 0, 0); 
        l.ctx.clearRect(selection.x, selection.y, selection.w, selection.h); 
        l.ctx.save();
        const cx = selection.x + selection.w / 2 + selection.offsetX;
        const cy = selection.y + selection.h / 2 + selection.offsetY;
        l.ctx.translate(cx, cy); l.ctx.rotate(selection.rotate * Math.PI / 180);
        const sFact = selection.scale / 100; l.ctx.scale(sFact, sFact);
        l.ctx.drawImage(selection.buffer, -selection.w / 2, -selection.h / 2); l.ctx.restore();
        const visualW = selection.w * sFact; const visualH = selection.h * sFact;
        marqueeBox.style.left = (cx - visualW / 2) + 'px'; marqueeBox.style.top = (cy - visualH / 2) + 'px';
        marqueeBox.style.width = visualW + 'px'; marqueeBox.style.height = visualH + 'px';
    }
        
    function changeCanvasDimensionsManual() {
        const userW = prompt("Enter canvas width (pixels):", canvasW);
        if (userW === null) return;
        
        const userH = prompt("Enter canvas height (pixels):", canvasH);
        if (userH === null) return;

        const parseW = parseInt(userW);
        const parseH = parseInt(userH);

        if (isNaN(parseW) || parseW <= 0 || isNaN(parseH) || parseH <= 0) {
            alert("Error: Enter valid numbers (e.g., 1280)");
            return;
        }

        if (parseW > 10000 || parseH > 10000) {
            alert("Error: Maximum 10000px per dimension");
            return;
        }

        applyNewCanvasDimensions(parseW, parseH, false);
        alert(`Canvas resized to ${parseW} x ${parseH}!\n(Original content kept at top-left)`);
    }

    function deleteLayerByIdx(idx, e) {
        e.stopPropagation(); 
        if (layers.length <= 1) return alert("Cannot delete last layer");
        
        const result = confirm(`Delete layer "${layers[idx].name}"?\n(Cannot undo)`);
        
        if (result) {
            layers[idx].canvas.remove();
            layers.splice(idx, 1);
            
            if (activeIdx >= layers.length) {
                activeIdx = layers.length - 1;
            } else if (activeIdx === idx) {
                activeIdx = Math.max(0, idx - 1);
            }
            
            clearMarquee();
            refreshMemCanvas();
            saveState();
            updateUI();
        }
    }

    function saveState() {
        const state = layers.map(l => {
            const cache = document.createElement('canvas'); cache.width = canvasW; cache.height = canvasH;
            cache.getContext('2d').drawImage(l.canvas, 0, 0);
            return { canvas: cache, name: l.name, visible: l.visible, opacity: l.opacity };
        });
        if (hStep < history.length - 1) history = history.slice(0, hStep + 1);
        history.push(state); hStep++;
    }

    function undo() { if (hStep > 0) { hStep--; restore(); } }
    function redo() { if (hStep < history.length - 1) { hStep++; restore(); } }

    function restore() {
        const state = history[hStep];
        state.forEach((s, i) => {
            layers[i].ctx.clearRect(0, 0, canvasW, canvasH); layers[i].ctx.drawImage(s.canvas, 0, 0);
            layers[i].visible = s.visible; layers[i].opacity = s.opacity;
            layers[i].canvas.style.opacity = s.visible ? (s.opacity / 100) : '0';
        });
        refreshMemCanvas(); clearMarquee(); updateUI();
    }

    function updateUI() {
        layerList.innerHTML = '';
        layers.forEach((l, idx) => {
            const div = document.createElement('div');
            div.className = `layer-item ${idx === activeIdx ? 'active' : ''}`;
            div.onclick = () => { activeIdx = idx; clearMarquee(); refreshMemCanvas(); opacitySlider.value = l.opacity; opacityValue.innerText = l.opacity; updateUI(); };
            
            div.innerHTML = `
                <span>${l.name}</span>
                <div class="layer-controls">
                    <button class="layer-btn" onclick="toggleLayerVisibility(${idx}, event)" title="Toggle visibility">${l.visible ? '👁️' : '🙈'}</button>
                    <button class="layer-btn" onclick="moveLayerToFront(${idx}, event)" title="Move to front">⬆️</button>
                    <button class="layer-btn" onclick="moveLayerToBack(${idx}, event)" title="Move to back">⬇️</button>
                    <button class="layer-btn" onclick="deleteLayerByIdx(${idx}, event)" style="color:#ff6666;" title="Delete layer">🗑️</button>
                </div>
            `;
            layerList.appendChild(div);
        });
    }

    function setTool(t) { 
        if (tool === 'marquee' && selection.active) saveState();
        tool = t; if(t !== 'marquee') clearMarquee();
        document.querySelectorAll('.tool-icon').forEach(b => b.classList.toggle('active', b.id === 'btn-'+t));
        if (t === 'pen') { sizeLabel.innerText = "Brush Size"; sizeSlider.value = penSize; sizeValue.innerText = penSize; }
        else if (t === 'eraser') { sizeLabel.innerText = "Eraser Size"; sizeSlider.value = eraserSize; sizeValue.innerText = eraserSize; }
        else if (t === 'bucket') { sizeLabel.innerText = "Fill Tolerance"; }
        if (tool === 'hand') pCanvas.className = 'hand-mode';
        else if (tool === 'marquee' && selection.active) pCanvas.className = 'move-mode';
        else pCanvas.className = '';
    }

    function clearMarquee() {
        selection.active = false; selection.offsetX = 0; selection.offsetY = 0; selection.scale = 100; selection.rotate = 0;
        marqueeBox.style.display = 'none'; scaleSlider.value = 100; scaleValue.innerText = "100"; rotateSlider.value = 0; rotateValue.innerText = "0";
    }

    function getRawCanvasPos(clientX, clientY) {
        const r = pCanvas.getBoundingClientRect();
        return { x: (clientX - r.left) * (canvasW / r.width), y: (clientY - r.top) * (canvasH / r.height) };
    }

    function handleStart(clientX, clientY) {
        isTouching = true; const p = getRawCanvasPos(clientX, clientY);
        startX = p.x; startY = p.y; lastX = clientX; lastY = clientY;
        const l = layers[activeIdx];
        if (!l || !l.visible) { isTouching = false; return; }
        
        if (tool === 'marquee') {
            const sFact = selection.scale / 100; const visualW = selection.w * sFact; const visualH = selection.h * sFact;
            const cx = selection.x + selection.w / 2 + selection.offsetX; const cy = selection.y + selection.h / 2 + selection.offsetY;
            
            if (selection.active && p.x >= cx - visualW / 2 && p.x <= cx + visualW / 2 && p.y >= cy - visualH / 2 && p.y <= cy + visualH / 2) { 
                mode = 'marquee-move'; 
            } else { 
                if (selection.active) saveState();
                clearMarquee();
                mode = 'marquee-draw';
            }
        } else if (tool === 'hand') { mode = 'pan'; }
        else if (tool === 'bucket') {
            const imgData = l.ctx.getImageData(Math.floor(p.x), Math.floor(p.y), 1, 1).data;
            floodFill(l.ctx, p.x, p.y, document.getElementById('colorPicker').value, 30);
            refreshMemCanvas(); 
            saveState();
            mode = 'none';
        }
        else { pCtx.clearRect(0, 0, canvasW, canvasH); pCtx.beginPath(); pCtx.moveTo(p.x, p.y); mode = 'draw'; }
    }

    function handleMove(clientX, clientY, touches) {
        if (!isTouching) return;
        if (touches && touches.length === 2) {
            mode = 'zoom'; const dist = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
            if (initialDist === 0) { initialDist = dist; return; }
            vScale *= (dist / initialDist); initialDist = dist; stage.style.transform = `translate(${vX}px, ${vY}px) scale(${vScale})`; return;
        }
        const p = getRawCanvasPos(clientX, clientY); const l = layers[activeIdx];
        if (mode === 'pan' || tool === 'hand') {
            vX += (clientX - lastX); vY += (clientY - lastY); stage.style.transform = `translate(${vX}px, ${vY}px) scale(${vScale})`;
        } else if (mode === 'marquee-draw') {
            const x = Math.min(startX, p.x); const y = Math.min(startY, p.y); const w = Math.abs(p.x - startX); const h = Math.abs(p.y - startY);
            marqueeBox.style.display = 'block'; marqueeBox.style.left = x + 'px'; marqueeBox.style.top = y + 'px'; marqueeBox.style.width = w + 'px'; marqueeBox.style.height = h + 'px';
            selection.x = x; selection.y = y; selection.w = w; selection.h = h;
        } else if (mode === 'marquee-move') {
            selection.offsetX += (p.x - startX); selection.offsetY += (p.y - startY); startX = p.x; startY = p.y; renderSelectionTransform();
        } else if (mode === 'draw' && l) {
            pCtx.lineTo(p.x, p.y); pCtx.strokeStyle = tool === 'eraser' ? '#ffffff' : document.getElementById('colorPicker').value;
            pCtx.lineWidth = tool === 'eraser' ? eraserSize : penSize; pCtx.lineCap = 'round'; pCtx.lineJoin = 'round'; pCtx.stroke();
        }
        lastX = clientX; lastY = clientY;
    }

    function handleEnd() {
        if (!isTouching) return; const l = layers[activeIdx];
        if (mode === 'draw' && l) {
            l.ctx.save(); if (tool === 'eraser') l.ctx.globalCompositeOperation = 'destination-out';
            l.ctx.drawImage(pCanvas, 0, 0); l.ctx.restore(); pCtx.clearRect(0, 0, canvasW, canvasH); refreshMemCanvas(); saveState();
        } else if (mode === 'marquee-draw' && l) {
            if (selection.w > 5 && selection.h > 5) {
                selection.active = true;
                l.memCanvas.getContext('2d').clearRect(0, 0, canvasW, canvasH); l.memCanvas.getContext('2d').drawImage(l.canvas, 0, 0);
                
                const rawBuffer = document.createElement('canvas'); 
                rawBuffer.width = selection.w; rawBuffer.height = selection.h;
                const rCtx = rawBuffer.getContext('2d');
                rCtx.drawImage(l.canvas, selection.x, selection.y, selection.w, selection.h, 0, 0, selection.w, selection.h);
                
                const bData = rCtx.getImageData(0, 0, selection.w, selection.h);
                const pix = bData.data;
                for (let i = 0; i < pix.length; i += 4) {
                    if (pix[i] >= 242 && pix[i+1] >= 242 && pix[i+2] >= 242) {
                        pix[i+3] = 0; 
                    }
                }
                rCtx.putImageData(bData, 0, 0);
                selection.buffer = rawBuffer; 
                
                renderSelectionTransform();
            } else { clearMarquee(); }
        } else if (mode === 'marquee-move') { saveState(); }
        isTouching = false; mode = 'none'; initialDist = 0;
    }

    pCanvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY, null));
    window.addEventListener('mouseup', handleEnd);
    pCanvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; handleStart(t.clientX, t.clientY); }, {passive: false});
    window.addEventListener('touchmove', e => { 
        e.preventDefault(); 
        if (e.touches.length === 2) { handleMove(0, 0, e.touches); } 
        else { const t = e.touches[0]; handleMove(t.clientX, t.clientY, null); } 
    }, {passive: false});
    window.addEventListener('touchend', handleEnd);
    viewport.addEventListener('wheel', e => { e.preventDefault(); vScale *= e.deltaY > 0 ? 0.9 : 1.1; stage.style.transform = `translate(${vX}px, ${vY}px) scale(${vScale})`; }, {passive: false});

    function exportSVG() {
        let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${canvasW}" height="${canvasH}" viewBox="0 0 ${canvasW} ${canvasH}">`;
        layers.forEach(l => { if (l.visible) { svgContent += `<image opacity="${l.opacity/100}" width="${canvasW}" height="${canvasH}" href="${l.canvas.toDataURL()}"/>`; } });
        svgContent += `</svg>`;
        const blob = new Blob([svgContent], { type: 'image/svg+xml' });
        const a = document.createElement('a'); a.download = 'artwork.svg'; a.href = URL.createObjectURL(blob); a.click();
    }

    function importSVG(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const parser = new DOMParser(); const xmlDoc = parser.parseFromString(e.target.result, "image/svg+xml");
            const images = xmlDoc.getElementsByTagName("image");
            if(images.length > 0) {
                document.querySelectorAll('.layer-canvas').forEach(c => c.remove()); layers = []; activeIdx = -1;
                Array.from(images).forEach((imgTag) => {
                    const img = new Image();
                    img.onload = () => { addLayer(`Layer ${layers.length+1}`, false, img); updateUI(); };
                    img.src = imgTag.getAttribute("href");
                });
            }
        };
        reader.readAsText(file);
    }
    
    function downloadImage() { 
        const out = document.createElement('canvas'); 
        out.width = canvasW; 
        out.height = canvasH; 
        const oCtx = out.getContext('2d'); 
        oCtx.fillStyle = "white"; 
        oCtx.fillRect(0, 0, canvasW, canvasH);
        layers.forEach(l => { 
            if(l.visible) {
                oCtx.globalAlpha = l.opacity / 100;
                oCtx.drawImage(l.canvas, 0, 0); 
                oCtx.globalAlpha = 1;
            }
        }); 
        const link = document.createElement('a'); 
        link.href = out.toDataURL(); 
        link.download = 'canvas.png'; 
        link.click(); 
    }
</script>
