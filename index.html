<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Svg Studio Edit Pro</title>
    <style>
       :root {
  --bg: #1e1e1e;
  --panel: #333;
  --accent: #0078d4;
  --text: #eee;
  --border: #444;
  --canvas-bg: #ffffff;
}

/* 基本リセット / レイアウト安定化 */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: #282828;
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  user-select: none;
  -webkit-user-select: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

/* ヘッダ */
header {
  background: var(--bg);
  height: 60px;
  flex: 0 0 60px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  border-bottom: 2px solid var(--border);
  gap: 10px;
  z-index: 1100;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* メインエリア */
#main {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;
  overflow: hidden;
}

/* サイドバー */
#sidebar {
  width: 75px;
  flex: 0 0 75px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 15px;
  gap: 15px;
  z-index: 1000;
  overflow: auto;
}

/* ツールボタン */
.tool-icon {
  width: 55px;
  height: 55px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  font-size: 30px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s ease, transform 0.08s ease;
  -webkit-tap-highlight-color: transparent;
}
.tool-icon:hover { background: #555; }
.tool-icon.active { background: var(--accent); }

/* ビューポート */
#viewport {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 0;
  background: #191919;
  touch-action: none;
}

/* ステージ */
#view-stage {
  position: relative;
  transform-origin: center center;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(0,0,0,0.8);
  background: var(--canvas-bg);
  width: calc(100% - 32px);
  height: calc(100% - 32px);
  max-width: 100%;
  max-height: 100%;
  border-radius: 6px;
}

/* キャンバス群 */
#canvas-stack {
  width: 100%;
  height: 100%;
  position: relative;
}

/* レイヤーキャンバス */
canvas.layer-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  display: block;
  pointer-events: none;
  background: transparent !important;
}

/* 描画用キャンバス */
#paint-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
  pointer-events: auto !important;
  z-index: 1000;
  cursor: crosshair;
  background: transparent;
}
#paint-canvas.hand-mode { cursor: grab; }
#paint-canvas.move-mode { cursor: move; }

/* 選択範囲 */
#marquee-box {
  position: absolute;
  border: 2px dashed #fff;
  outline: 1px solid #000;
  display: none;
  z-index: 2000;
  pointer-events: none;
  background: rgba(255,255,255,0.02);
}

/* 変形ハンドル */
.morph-handle {
  position: absolute;
  width: 14px;
  height: 14px;
  background: #ff6600;
  border: 2px solid white;
  border-radius: 50%;
  cursor: grab;
  z-index: 2001;
  display: none;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px rgba(0,0,0,0.5);
}
.morph-handle:hover { background: #ffaa00; transform: translate(-50%, -50%) scale(1.2); }
.morph-handle.active { background: #ff0000; display: block; transform: translate(-50%, -50%) scale(1.3); }

/* 線操作ハンドル */
.edge-handle {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #00aa99;
  border: 1px solid white;
  border-radius: 50%;
  cursor: pointer;
  z-index: 2002;
  display: none;
  transform: translate(-50%, -50%);
}
.edge-handle:hover { background: #00ff88; }

/* 3D モーダル */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 5000;
  justify-content: center;
  align-items: center;
}
.modal-content {
  background: var(--panel);
  padding: 20px;
  border-radius: 12px;
  border: 2px solid var(--accent);
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-close { float: right; cursor: pointer; font-size: 24px; color: #aaa; }
.modal-close:hover { color: white; }
.modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--accent); }

/* コントロール行 */
.control-row { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
.control-row label { width: 80px; color: #aaa; }
.control-row input[type="range"] { flex: 1; }
.control-row .value { width: 40px; text-align: right; color: var(--accent); font-weight: bold; }

/* 右パネル */
#right-panel {
  width: 280px;
  flex: 0 0 280px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: auto;
  min-width: 200px;
}

/* 共通コントロール */
.control-group { padding: 12px; border-bottom: 1px solid #444; font-size: 13px; }
.control-group label { display: block; margin-bottom: 8px; color: #aaa; }
#layer-panel-section { flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; }
.layer-header-tools { padding: 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #444; }
#layer-list { flex: 1 1 auto; overflow-y: auto; padding: 6px; display: flex; flex-direction: column-reverse; min-height: 0; }
.layer-item { background: #444; margin: 4px 0; padding: 12px; font-size: 14px; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
.layer-item.active { background: var(--accent); border: 1px solid white; }
.layer-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.layer-btn { background: none; border: none; color: white; cursor: pointer; font-size: 14px; padding: 2px 4px; }
.layer-btn:hover { color: var(--accent); }

.action-btn {
  background: #555;
  color: white;
  border: none;
  padding: 12px 20px;
  cursor: pointer;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  transition: background 0.16s ease, transform 0.08s ease;
}
.action-btn:hover { background: #666; }

/* フォーム系 */
input[type="range"] { width: 100%; }
.hidden-file { display: none; }
.divider { width: 45px; border-top: 1px solid #555; }

/* モーダルツール */
.morph-toolbar {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.9);
  padding: 10px 15px;
  border-radius: 8px;
  border: 2px solid var(--accent);
  z-index: 3000;
  gap: 10px;
}
.morph-toolbar.active { display: flex; }
.morph-toolbar button { margin: 0 5px; }

@media (max-width: 900px) {
  #right-panel { display: none; }
  #view-stage { width: calc(100% - 16px); height: calc(100% - 16px); }
}

.modal-overlay.open { display: flex; }

.tool-icon:focus, .action-btn:focus, .layer-btn:focus {
  outline: 2px solid rgba(0,120,212,0.6);
  outline-offset: 2px;
}

#layer-list::-webkit-scrollbar, #sidebar::-webkit-scrollbar, header::-webkit-scrollbar {
  height: 8px;
  width: 8px;
}
#layer-list::-webkit-scrollbar-thumb, #sidebar::-webkit-scrollbar-thumb, header::-webkit-scrollbar-thumb {
  background: #444;
  border-radius: 6px;
}
    </style>

</head>
<body>

<header>
    <h3>Svg Studio Edit <span style="color:red;">Pro</span></h3>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <button class="action-btn" onclick="undo()">↩️ 戻す</button>
    <button class="action-btn" onclick="redo()">↪️ やり直す</button>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <button class="action-btn" style="background:#0078d4;" onclick="changeCanvasDimensionsManual()">📐 キャンバスサイズ</button>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <button class="action-btn" style="background:#cc3333;" onclick="deleteSelectionContent()">🗑️ 選択削除</button>
    <div style="width:2px; height:40px; background:#444; margin:0 5px;"></div>
    <input type="file" id="myFile" accept="image/*" style="display:none;"><button class="action-btn" onclick="document.getElementById('myFile').click()">🖼️ 画像追加</button>
    <button class="action-btn" style="background:#444;" onclick="exportSVG()">📤 SVG保存</button>
    <button class="action-btn" style="background:#444;" onclick="document.getElementById('svg-loader').click()">📥 SVG読込</button>
    <input type="file" id="svg-loader" class="hidden-file" accept=".svg" onchange="importSVG(this)">
    <button class="action-btn" onclick="downloadImage()" style="margin-left:auto; background: #0078d4;">💾 PNG保存</button>
</header>

<div id="main">
    <div id="sidebar">
        <button class="tool-icon active" id="btn-pen" onclick="setTool('pen')" title="ペンツール">🖌️</button>
        <button class="tool-icon" id="btn-eraser" onclick="setTool('eraser')" title="消しゴムツール">🧽</button>
        <button class="tool-icon" id="btn-bucket" onclick="setTool('bucket')" title="バケツ塗りつぶし">🪣</button>
        <button class="tool-icon" id="btn-marquee" onclick="setTool('marquee')" title="選択枠ツール">🔲</button>
        <button class="tool-icon" id="btn-hand" onclick="setTool('hand')" title="手のひらツール">✋</button>
        <button class="tool-icon" id="btn-morph" onclick="setTool('morph')" title="形を変えるツール">🔄</button>
        
        <div class="divider"></div>
        <button class="tool-icon" style="background:#444; font-size:22px;" onclick="copySelectionContent()" title="選択をコピー">✂️</button>
        <button class="tool-icon" style="background:#444; font-size:22px;" onclick="pasteToSameLayer()" title="貼り付け">📋</button>
        <div class="divider"></div>
        <input type="color" id="colorPicker" value="#000000" style="width:50px; height:40px; cursor:pointer; border-radius:8px;">
    </div>

    <div id="viewport">
        <div id="view-stage">
            <div id="canvas-stack">
                <canvas id="paint-canvas"></canvas>
            </div>
            <div id="marquee-box"></div>
            <div id="morph-handles-container"></div>
            <canvas id="morph-preview-canvas" style="position:absolute; top:0; left:0; z-index:1999; display:none;"></canvas>
        </div>
    </div>

    <div id="right-panel">
        <div class="control-group">
            <label id="size-label">ブラシの太さ</label>
            <input type="range" id="sizeSlider" min="1" max="100" value="10" oninput="onSizeSliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="sizeValue">10</span>px</div>
        </div>
        <div class="control-group">
            <label>レイヤー透明度</label>
            <input type="range" id="opacitySlider" min="0" max="100" value="100" oninput="onOpacitySliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="opacityValue">100</span>%</div>
        </div>
        <div class="control-group">
            <label>選択範囲の大きさ (0% 〜 500%)</label>
            <input type="range" id="scaleSlider" min="0" max="500" value="100" oninput="onScaleSliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="scaleValue">100</span>%</div>
        </div>
        <div class="control-group">
            <label>選択範囲���回転角度 (0° 〜 180°)</label>
            <input type="range" id="rotateSlider" min="0" max="180" value="0" oninput="onRotateSliderChange(this.value)">
            <div style="text-align: right; font-weight: bold; color: var(--accent);"><span id="rotateValue">0</span>°</div>
        </div>
        <div id="layer-panel-section">
            <div class="layer-header-tools">
                <span style="font-size: 13px; color: #aaa; font-weight: bold;">レイヤー</span>
                <button class="action-btn" onclick="addLayerManual()" style="background:#0078d4; padding:6px 12px; font-size:13px;">＋ 追加</button>
            </div>
            <div id="layer-list"></div>
        </div>
    </div>
</div>

<!-- 形を変えるツールバー -->
<div id="morph-toolbar" class="morph-toolbar">
    <button class="action-btn" onclick="addPointToMorph()" style="background:#00aa99; padding:8px 12px;">➕ 点追加</button>
    <button class="action-btn" onclick="deleteMorphPoint()" style="background:#cc3333; padding:8px 12px;">🗑️ 削除</button>
    <label style="color: white; margin: 0 5px;">曲線:</label>
    <select id="curveType" style="padding:6px; border-radius:6px; background:#555; color:white; border:1px solid #777;">
        <option value="linear">🔲 角ばる</option>
        <option value="bezier">⭕ 丸い</option>
    </select>
    <button class="action-btn" onclick="applyMorphTransform()" style="background:#0078d4; padding:8px 12px;">✓ 適用</button>
    <button class="action-btn" onclick="clearMorphMode()" style="background:#666; padding:8px 12px;">✕ キャンセル</button>
</div>

<script>
    const stage = document.getElementById('view-stage');
    const stack = document.getElementById('canvas-stack');
    const pCanvas = document.getElementById('paint-canvas');
    const pCtx = pCanvas.getContext('2d');
    const marqueeBox = document.getElementById('marquee-box');
    const layerList = document.getElementById('layer-list');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const sizeLabel = document.getElementById('size-label');
    const opacitySlider = document.getElementById('opacitySlider');
    const opacityValue = document.getElementById('opacityValue');
    const scaleSlider = document.getElementById('scaleSlider');
    const scaleValue = document.getElementById('scaleValue');
    const rotateSlider = document.getElementById('rotateSlider');
    const rotateValue = document.getElementById('rotateValue');
    const morphHandlesContainer = document.getElementById('morph-handles-container');
    const morphToolbar = document.getElementById('morph-toolbar');
    const morphPreviewCanvas = document.getElementById('morph-preview-canvas');
    
    let canvasW = 800, canvasH = 600;
    let layers = [], activeIdx = -1, tool = 'pen';
    let vScale = 1, vX = 0, vY = 0;
    let isTouching = false, startX, startY, lastX, lastY, initialDist = 0, mode = 'none';
    let history = [], hStep = -1;
    let clipboardBuffer = null;
    let clipboardWidth = 0;
    let clipboardHeight = 0;

    let penSize = 10, eraserSize = 20;
    let selection = { active: false, x: 0, y: 0, w: 0, h: 0, scale: 100, rotate: 0, buffer: null, offsetX: 0, offsetY: 0 };
    
    // 形を変える機能（改善版）
    let morphMode = { 
        active: false, 
        points: [], 
        edges: [], 
        selectedPoint: -1, 
        selectedEdge: -1,
        isDragging: false,
        curveType: 'linear'
    };
    
    // 塗りつぶしのヘルパー関数
    function floodFill(ctx, x, y, fillColor, tolerance = 30) {
        const imageData = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height);
        const data = imageData.data;
        const width = ctx.canvas.width;
        
        const startIdx = (Math.floor(y) * width + Math.floor(x)) * 4;
        const startR = data[startIdx];
        const startG = data[startIdx + 1];
        const startB = data[startIdx + 2];
        const startA = data[startIdx + 3];
        
        const fillR = parseInt(fillColor.substr(1, 2), 16);
        const fillG = parseInt(fillColor.substr(3, 2), 16);
        const fillB = parseInt(fillColor.substr(5, 2), 16);
        
        if (startR === fillR && startG === fillG && startB === fillB) return;
        
        const queue = [[Math.floor(x), Math.floor(y)]];
        const visited = new Set();
        
        while (queue.length > 0) {
            const [px, py] = queue.shift();
            if (px < 0 || px >= width || py >= ctx.canvas.height) continue;
            
            const key = `${px},${py}`;
            if (visited.has(key)) continue;
            visited.add(key);
            
            const idx = (py * width + px) * 4;
            const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
            
            if (Math.abs(r - startR) <= tolerance && Math.abs(g - startG) <= tolerance && 
                Math.abs(b - startB) <= tolerance && a > 128) {
                data[idx] = fillR; data[idx + 1] = fillG; data[idx + 2] = fillB; data[idx + 3] = 255;
                queue.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
            }
        }
        ctx.putImageData(imageData, 0, 0);
    }

    document.getElementById('myFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return alert('ファイルを選択してください');
        
        if (activeIdx < 0 || !layers[activeIdx]) return alert('レイヤーを選択してください');
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                const l = layers[activeIdx];
                const ctx = l.ctx;
                
                ctx.clearRect(0, 0, canvasW, canvasH);
                
                const imgAspect = img.width / img.height;
                const canvasAspect = canvasW / canvasH;
                let drawW, drawH, drawX = 0, drawY = 0;
                
                if (imgAspect > canvasAspect) {
                    drawW = canvasW;
                    drawH = canvasW / imgAspect;
                    drawY = (canvasH - drawH) / 2;
                } else {
                    drawH = canvasH;
                    drawW = canvasH * imgAspect;
                    drawX = (canvasW - drawW) / 2;
                }
                
                ctx.drawImage(img, drawX, drawY, drawW, drawH);
                refreshMemCanvas();
                saveState();
                updateUI();
            };
            img.onerror = function() { alert('画像の読み込みに失敗しました'); };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    });

    setTimeout(() => {
        applyNewCanvasDimensions(800, 600, true);
    }, 10);

    function applyNewCanvasDimensions(w, h, initMode = false) {
        canvasW = w; canvasH = h;
        stage.style.width = canvasW + "px";
        stage.style.height = canvasH + "px";
        pCanvas.width = canvasW;
        pCanvas.height = canvasH;
        morphPreviewCanvas.width = canvasW;
        morphPreviewCanvas.height = canvasH;
        
        if (initMode) {
            addLayer("背景レイヤー", true);
            saveState(); updateUI();
        } else {
            layers.forEach(l => {
                const tmp = document.createElement('canvas');
                tmp.width = l.canvas.width; tmp.height = l.canvas.height;
                tmp.getContext('2d').drawImage(l.canvas, 0, 0);
                
                l.canvas.width = canvasW; l.canvas.height = canvasH;
                l.memCanvas.width = canvasW; l.memCanvas.height = canvasH;
                
                if (l.name === "背景レイヤー") {
                    l.ctx.fillStyle = "white"; l.ctx.fillRect(0, 0, canvasW, canvasH);
                }
                l.ctx.drawImage(tmp, 0, 0);
            });
            clearMarquee(); refreshMemCanvas(); saveState();
        }
    }

    function addLayer(name = `レイヤー ${layers.length + 1}`, isWhite = false, fromImg = null) {
        const canvas = document.createElement('canvas');
        canvas.width = canvasW; canvas.height = canvasH;
        canvas.className = 'layer-canvas';
        stack.insertBefore(canvas, pCanvas);
        const ctx = canvas.getContext('2d');
        
        if(isWhite) { ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvasW, canvasH); }
        if(fromImg) { ctx.drawImage(fromImg, 0, 0); }
        
        const memCanvas = document.createElement('canvas');
        memCanvas.width = canvasW; memCanvas.height = canvasH;
        layers.push({ canvas, ctx, name, memCanvas: memCanvas, visible: true, opacity: 100 });
        activeIdx = layers.length - 1;
        refreshMemCanvas();
    }

    function addLayerManual() { addLayer(); saveState(); updateUI(); }

    function copySelectionContent() {
        if (!selection.active || activeIdx < 0) return alert("🔲 選択枠ツールで囲んでからコピーしてください");
        clipboardBuffer = document.createElement('canvas');
        clipboardBuffer.width = selection.w; clipboardBuffer.height = selection.h;
        clipboardBuffer.getContext('2d').drawImage(selection.buffer, 0, 0);
        clipboardWidth = selection.w; clipboardHeight = selection.h;
        alert("選択部分をコピーしました");
    }

    function pasteToSameLayer() {
        if (!clipboardBuffer || activeIdx < 0) return alert("コピーされたデータがありません");
        if (selection.active) saveState();
        clearMarquee();
        selection.x = 40; selection.y = 40;
        selection.w = clipboardWidth; selection.h = clipboardHeight;
        selection.active = true;
        refreshMemCanvas();
        selection.buffer = document.createElement('canvas');
        selection.buffer.width = clipboardWidth; selection.buffer.height = clipboardHeight;
        selection.buffer.getContext('2d').drawImage(clipboardBuffer, 0, 0);
        renderSelectionTransform();
        marqueeBox.style.display = 'block';
        setTool('marquee');
    }

    function toggleLayerVisibility(idx, e) {
        e.stopPropagation();
        layers[idx].visible = !layers[idx].visible;
        layers[idx].canvas.style.opacity = layers[idx].visible ? (layers[idx].opacity / 100) : '0';
        updateUI();
    }

    function moveLayerToFront(idx, e) {
        e.stopPropagation();
        if (idx >= layers.length - 1) return;
        const layer = layers.splice(idx, 1)[0];
        layers.push(layer);
        stack.insertBefore(layer.canvas, pCanvas);
        if (activeIdx === idx) activeIdx = layers.length - 1;
        else if (activeIdx > idx) activeIdx--;
        refreshMemCanvas();
        updateUI();
        saveState();
    }

    function moveLayerToBack(idx, e) {
        e.stopPropagation();
        if (idx <= 0) return;
        const layer = layers.splice(idx, 1)[0];
        layers.unshift(layer);
        stack.insertBefore(layer.canvas, stack.firstChild);
        if (activeIdx === idx) activeIdx = 0;
        else if (activeIdx > idx) activeIdx--;
        refreshMemCanvas();
        updateUI();
        saveState();
    }

    function deleteSelectionContent() {
        if (!selection.active || activeIdx < 0) return;
        const l = layers[activeIdx];
        
        l.ctx.clearRect(0, 0, canvasW, canvasH);
        l.ctx.drawImage(l.memCanvas, 0, 0);
        l.ctx.clearRect(selection.x, selection.y, selection.w, selection.h);
        
        clearMarquee(); 
        refreshMemCanvas(); 
        saveState();
    }

    function onSizeSliderChange(val) {
        const v = parseInt(val); sizeValue.innerText = v;
        if (tool === 'pen') penSize = v; else if (tool === 'eraser') eraserSize = v;
    }

    function onOpacitySliderChange(val) {
        if (activeIdx < 0) return;
        const v = parseInt(val);
        opacityValue.innerText = v;
        layers[activeIdx].opacity = v;
        layers[activeIdx].canvas.style.opacity = layers[activeIdx].visible ? (v / 100) : '0';
    }

    function refreshMemCanvas() {
        if(activeIdx < 0 || !layers[activeIdx]) return;
        const l = layers[activeIdx];
        l.memCanvas.getContext('2d').clearRect(0, 0, canvasW, canvasH);
        l.memCanvas.getContext('2d').drawImage(l.canvas, 0, 0);
    }

    function onScaleSliderChange(val) {
        if (!selection.active) return;
        selection.scale = parseInt(val); scaleValue.innerText = val;
        renderSelectionTransform();
    }

    function onRotateSliderChange(val) {
        if (!selection.active) return;
        selection.rotate = parseInt(val); rotateValue.innerText = val;
        renderSelectionTransform();
    }

    function renderSelectionTransform() {
        if (!selection.active || activeIdx < 0 || !layers[activeIdx].memCanvas) return;
        const l = layers[activeIdx];
        l.ctx.clearRect(0, 0, canvasW, canvasH); l.ctx.drawImage(l.memCanvas, 0, 0); 
        l.ctx.clearRect(selection.x, selection.y, selection.w, selection.h); 
        l.ctx.save();
        const cx = selection.x + selection.w / 2 + selection.offsetX;
        const cy = selection.y + selection.h / 2 + selection.offsetY;
        l.ctx.translate(cx, cy); l.ctx.rotate(selection.rotate * Math.PI / 180);
        const sFact = selection.scale / 100; l.ctx.scale(sFact, sFact);
        l.ctx.drawImage(selection.buffer, -selection.w / 2, -selection.h / 2); l.ctx.restore();
        const visualW = selection.w * sFact; const visualH = selection.h * sFact;
        marqueeBox.style.left = (cx - visualW / 2) + 'px'; marqueeBox.style.top = (cy - visualH / 2) + 'px';
        marqueeBox.style.width = visualW + 'px'; marqueeBox.style.height = visualH + 'px';
    }
        
    function changeCanvasDimensionsManual() {
        const userW = prompt("キャンバスの横幅（ピクセル）を入力してください:", canvasW);
        if (userW === null) return;
        
        const userH = prompt("キャンバスの縦幅（ピクセル）を入力してください:", canvasH);
        if (userH === null) return;

        const parseW = parseInt(userW);
        const parseH = parseInt(userH);

        if (isNaN(parseW) || parseW <= 0 || isNaN(parseH) || parseH <= 0) {
            alert("エラー：正しい数値を入力してください（例: 1280）");
            return;
        }

        if (parseW > 10000 || parseH > 10000) {
            alert("エラー：10000ピクセル以下の画角を指定してください");
            return;
        }

        applyNewCanvasDimensions(parseW, parseH, false);
        alert(`キャンバスを ${parseW} x ${parseH} に変更しました！\n（既存の絵は左上に保持されています）`);
    }

    function deleteLayerByIdx(idx, e) {
        e.stopPropagation(); 
        if (layers.length <= 1) return alert("これ以上削除できません");
        
        const result = confirm(`本当に「${layers[idx].name}」を削除しますか？`);
        
        if (result) {
            layers[idx].canvas.remove();
            layers.splice(idx, 1);
            
            if (activeIdx >= layers.length) {
                activeIdx = layers.length - 1;
            } else if (activeIdx === idx) {
                activeIdx = Math.max(0, idx - 1);
            }
            
            clearMarquee();
            refreshMemCanvas();
            saveState();
            updateUI();
        }
    }

    function saveState() {
        const state = layers.map(l => {
            const cache = document.createElement('canvas'); cache.width = canvasW; cache.height = canvasH;
            cache.getContext('2d').drawImage(l.canvas, 0, 0);
            return { canvas: cache, name: l.name, visible: l.visible, opacity: l.opacity };
        });
        if (hStep < history.length - 1) history = history.slice(0, hStep + 1);
        history.push(state); hStep++;
    }

    function undo() { if (hStep > 0) { hStep--; restore(); } }
    function redo() { if (hStep < history.length - 1) { hStep++; restore(); } }

    function restore() {
        const state = history[hStep];
        state.forEach((s, i) => {
            layers[i].ctx.clearRect(0, 0, canvasW, canvasH); layers[i].ctx.drawImage(s.canvas, 0, 0);
            layers[i].visible = s.visible; layers[i].opacity = s.opacity;
            layers[i].canvas.style.opacity = s.visible ? (s.opacity / 100) : '0';
        });
        refreshMemCanvas(); clearMarquee(); updateUI();
    }

    function updateUI() {
        layerList.innerHTML = '';
        layers.forEach((l, idx) => {
            const div = document.createElement('div');
            div.className = `layer-item ${idx === activeIdx ? 'active' : ''}`;
            div.onclick = () => { activeIdx = idx; clearMarquee(); refreshMemCanvas(); opacitySlider.value = l.opacity; opacityValue.innerText = l.opacity; updateUI(); };
            
            div.innerHTML = `
                <span>${l.name}</span>
                <div class="layer-controls">
                    <button class="layer-btn" onclick="toggleLayerVisibility(${idx}, event)" title="表示/非表示">${l.visible ? '👁️' : '🙈'}</button>
                    <button class="layer-btn" onclick="moveLayerToFront(${idx}, event)" title="最前面">⬆️</button>
                    <button class="layer-btn" onclick="moveLayerToBack(${idx}, event)" title="最背面">⬇️</button>
                    <button class="layer-btn" onclick="deleteLayerByIdx(${idx}, event)" style="color:#ff6666;" title="削除">🗑️</button>
                </div>
            `;
            layerList.appendChild(div);
        });
    }

    // === 形を変える機能（改善版） ===
    function setTool(toolName) {
        if (toolName === 'morph' && selection.active) {
            initMorphMode();
        } else if (toolName !== 'morph' && morphMode.active) {
            clearMorphMode();
        }
        tool = toolName;
        document.querySelectorAll('.tool-icon').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${toolName}`).classList.add('active');
    }

    function initMorphMode() {
        if (activeIdx < 0 || !selection.active) {
            alert("選択範囲を作成してから使用してください");
            return;
        }
        
        morphMode.active = true;
        morphMode.points = [];
        morphMode.edges = [];
        morphMode.selectedPoint = -1;
        morphMode.curveType = 'linear';
        
        // 初期の4頂点
        const corners = [
            { x: selection.x, y: selection.y },
            { x: selection.x + selection.w, y: selection.y },
            { x: selection.x + selection.w, y: selection.y + selection.h },
            { x: selection.x, y: selection.y + selection.h }
        ];
        
        corners.forEach((corner, idx) => {
            createMorphPoint(corner.x, corner.y, idx);
        });
        
        // 辺の作成
        for (let i = 0; i < morphMode.points.length; i++) {
            const nextIdx = (i + 1) % morphMode.points.length;
            morphMode.edges.push({ p1: i, p2: nextIdx });
        }
        
        marqueeBox.style.display = 'none';
        morphToolbar.classList.add('active');
        drawMorphPreview();
    }

    function createMorphPoint(x, y, idx) {
        const handle = document.createElement('div');
        handle.className = 'morph-handle';
        handle.id = `morph-handle-${idx}`;
        handle.style.left = x + 'px';
        handle.style.top = y + 'px';
        handle.style.display = 'block';
        
        handle.addEventListener('mousedown', (e) => startMorphDrag(e, idx));
        handle.addEventListener('touchstart', (e) => startMorphDrag(e, idx, true), { passive: false });
        
        morphHandlesContainer.appendChild(handle);
        morphMode.points.push({ x, y, el: handle });
    }

    function startMorphDrag(e, pointIdx, isTouch = false) {
        e.preventDefault();
        morphMode.selectedPoint = pointIdx;
        morphMode.isDragging = true;
        const handle = document.getElementById(`morph-handle-${pointIdx}`);
        handle.classList.add('active');
        
        const onMouseMove = (ev) => {
            if (!morphMode.isDragging) return;
            
            let clientX, clientY;
            if (isTouch && ev.touches && ev.touches.length > 0) {
                clientX = ev.touches[0].clientX;
                clientY = ev.touches[0].clientY;
            } else if (ev.clientX !== undefined) {
                clientX = ev.clientX;
                clientY = ev.clientY;
            } else {
                return;
            }
            
            const rect = stage.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            morphMode.points[pointIdx].x = x;
            morphMode.points[pointIdx].y = y;
            handle.style.left = x + 'px';
            handle.style.top = y + 'px';
            
            drawMorphPreview();
        };
        
        const onMouseUp = () => {
            morphMode.isDragging = false;
            handle.classList.remove('active');
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('touchmove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            document.removeEventListener('touchend', onMouseUp);
        };
        
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('touchmove', onMouseMove, { passive: false });
        document.addEventListener('mouseup', onMouseUp);
        document.addEventListener('touchend', onMouseUp);
    }

    function addPointToMorph() {
        if (morphMode.points.length === 0) return;
        
        // 最初の辺の中点に新しい点を追加
        if (morphMode.edges.length === 0) return;
        
        const edge = morphMode.edges[0];
        const p1 = morphMode.points[edge.p1];
        const p2 = morphMode.points[edge.p2];
        
        const newX = (p1.x + p2.x) / 2;
        const newY = (p1.y + p2.y) / 2;
        
        // 新しい点を追加
        const newIdx = morphMode.points.length;
        createMorphPoint(newX, newY, newIdx);
        
        // 辺を再構成（新しい点を挿入）
        morphMode.edges.splice(1, 0, { p1: edge.p1, p2: newIdx });
        morphMode.edges[0] = { p1: newIdx, p2: edge.p2 };
        
        drawMorphPreview();
    }

    function deleteMorphPoint() {
        if (morphMode.selectedPoint === -1 || morphMode.points.length <= 3) return alert("最低3つの点が必要です");
        
        const idx = morphMode.selectedPoint;
        document.getElementById(`morph-handle-${idx}`).remove();
        morphMode.points.splice(idx, 1);
        
        // 辺の削除と再構成
        morphMode.edges = morphMode.edges.filter(e => e.p1 !== idx && e.p2 !== idx);
        
        // インデックス修正
        morphMode.edges.forEach(e => {
            if (e.p1 > idx) e.p1--;
            if (e.p2 > idx) e.p2--;
        });
        
        morphMode.selectedPoint = -1;
        
        // ハンドルのID再構成
        morphMode.points.forEach((p, i) => {
            p.el.id = `morph-handle-${i}`;
        });
        
        drawMorphPreview();
    }

    function drawMorphPreview() {
        const ctx = morphPreviewCanvas.getContext('2d');
        ctx.clearRect(0, 0, canvasW, canvasH);
        
        // 線を描画
        ctx.strokeStyle = '#00aa99';
        ctx.lineWidth = 2;
        ctx.fillStyle = 'rgba(0, 170, 153, 0.1)';
        
        if (morphMode.points.length > 0) {
            ctx.beginPath();
            ctx.moveTo(morphMode.points[0].x, morphMode.points[0].y);
            
            for (let i = 1; i < morphMode.points.length; i++) {
                if (morphMode.curveType === 'bezier') {
                    // Bezier曲線
                    const p0 = morphMode.points[i - 1];
                    const p1 = morphMode.points[i];
                    const cpX = (p0.x + p1.x) / 2;
                    const cpY = (p0.y + p1.y) / 2;
                    ctx.quadraticCurveTo(cpX, cpY, p1.x, p1.y);
                } else {
                    ctx.lineTo(morphMode.points[i].x, morphMode.points[i].y);
                }
            }
            
            // 最初の点に戻す
            if (morphMode.curveType === 'bezier') {
                const pLast = morphMode.points[morphMode.points.length - 1];
                const pFirst = morphMode.points[0];
                const cpX = (pLast.x + pFirst.x) / 2;
                const cpY = (pLast.y + pFirst.y) / 2;
                ctx.quadraticCurveTo(cpX, cpY, pFirst.x, pFirst.y);
            } else {
                ctx.lineTo(morphMode.points[0].x, morphMode.points[0].y);
            }
            
            ctx.fill();
            ctx.stroke();
        }
        
        morphPreviewCanvas.style.display = 'block';
    }

    function applyMorphTransform() {
        if (!morphMode.active || activeIdx < 0 || morphMode.points.length < 3) return alert("形を変えるツールを初期化してください");
        
        const l = layers[activeIdx];
        const srcCanvas = selection.buffer;
        
        const destCanvas = document.createElement('canvas');
        destCanvas.width = canvasW;
        destCanvas.height = canvasH;
        const destCtx = destCanvas.getContext('2d');
        
        // 四角形から多角形への変換
        const src = [
            { x: 0, y: 0 },
            { x: srcCanvas.width, y: 0 },
            { x: srcCanvas.width, y: srcCanvas.height },
            { x: 0, y: srcCanvas.height }
        ];
        
        // 描画
        l.ctx.clearRect(0, 0, canvasW, canvasH);
        l.ctx.drawImage(l.memCanvas, 0, 0);
        
        // 新しい形で描画
        destCtx.save();
        destCtx.beginPath();
        if (morphMode.points.length > 0) {
            destCtx.moveTo(morphMode.points[0].x, morphMode.points[0].y);
            for (let i = 1; i < morphMode.points.length; i++) {
                if (morphMode.curveType === 'bezier') {
                    const p0 = morphMode.points[i - 1];
                    const p1 = morphMode.points[i];
                    const cpX = (p0.x + p1.x) / 2;
                    const cpY = (p0.y + p1.y) / 2;
                    destCtx.quadraticCurveTo(cpX, cpY, p1.x, p1.y);
                } else {
                    destCtx.lineTo(morphMode.points[i].x, morphMode.points[i].y);
                }
            }
            destCtx.closePath();
            destCtx.clip();
        }
        
        destCtx.drawImage(srcCanvas, selection.x, selection.y);
        destCtx.restore();
        
        l.ctx.drawImage(destCanvas, 0, 0);
        
        clearMorphMode();
        refreshMemCanvas();
        saveState();
        alert("形を変えました！");
    }

    function clearMorphMode() {
        morphMode.active = false;
        morphMode.points = [];
        morphMode.edges = [];
        morphMode.selectedPoint = -1;
        document.querySelectorAll('.morph-handle').forEach(h => h.remove());
        morphPreviewCanvas.style.display = 'none';
        morphToolbar.classList.remove('active');
        marqueeBox.style.display = 'block';
    }

    // === キャンバスイベント ===
    pCanvas.addEventListener('mousedown', (e) => {
        if (tool !== 'morph') {
            // 他のツール処理
            startX = e.offsetX; startY = e.offsetY; lastX = startX; lastY = startY;
            mode = tool;
        }
    });

    pCanvas.addEventListener('mousemove', (e) => {
        if (tool !== 'morph' && mode !== 'none') {
            // ペン・消しゴム等の処理
            lastX = e.offsetX; lastY = e.offsetY;
        }
    });

    pCanvas.addEventListener('mouseup', () => { mode = 'none'; });

    // ツール切り替え
    function setTool(toolName) {
        if (toolName === 'morph' && selection.active) {
            tool = toolName;
            initMorphMode();
        } else if (toolName !== 'morph' && morphMode.active) {
            clearMorphMode();
            tool = toolName;
        } else {
            tool = toolName;
        }
        document.querySelectorAll('.tool-icon').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${toolName}`).classList.add('active');
    }

    // 選択ツール関連
    function clearMarquee() {
        selection.active = false;
        marqueeBox.style.display = 'none';
    }

    // ダミー関数（機能拡張用）
    function exportSVG() { alert('SVG保存機能は準備中です'); }
    function importSVG() { alert('SVG読込機能は準備中です'); }
    function downloadImage() { alert('PNG保存機能は準備中です'); }

</script>

</body>
</html>
